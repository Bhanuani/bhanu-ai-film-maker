<html lang="en">
<head>

  <title>CINEMOTION STUDIO - Master Directors Vault (Private)</title>

  <style>
    :root {
      --bg-dark: #040711;
      --card-bg: #0d121f;
      --border-color: rgba(255, 255, 255, 0.08);
      --accent-cyan: #00d2ff;
      --accent-glow: rgba(0, 210, 255, 0.35);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { background: #040711; }
    body {
      background-color: transparent;
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }
    #siteBackgroundVideo {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      object-position: center;
      z-index: -2;
      pointer-events: none;
      opacity: .34;
      filter: brightness(.62) saturate(1.08);
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(4,7,17,.60), rgba(4,7,17,.78)),
        radial-gradient(ellipse at 50% 15%, rgba(0,150,210,.10), transparent 62%);
    }

    body:not(.is-admin-active) .admin-only {
      display: none !important;
    }

    /* TAB SWITCH WELCOME BACK */
    #welcomeBackOverlay {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(4, 7, 17, 0.45);
      z-index: 99999999;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      overflow: hidden;
    }

    #welcomeBackOverlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .welcome-video-container {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      mix-blend-mode: screen;
      -webkit-mask-image: radial-gradient(ellipse at center, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 85%);
      mask-image: radial-gradient(ellipse at center, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 85%);
      pointer-events: none;
    }

    .welcome-direct-video {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      mix-blend-mode: screen;
      filter: contrast(160%) brightness(110%);
      pointer-events: none;
    }

    /* HEADER */
    header {
      background: rgba(4, 7, 17, 0.95);
      border-bottom: 1px solid var(--border-color);
      backdrop-filter: blur(16px);
      position: sticky;
      top: 0;
      z-index: 100;
      width: 100%;
    }

    .header-inner {
      max-width: 1332px;
      width: min(1332px, calc(100% - 32px));
      margin: 0 auto;
      padding: 0.85rem 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1.5rem;
    }

    .brand-group { display: flex; align-items: center; gap: 1.25rem; }

    .menu-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 0.5rem 0.65rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s;
    }

    .menu-btn:hover { background: rgba(0, 210, 255, 0.1); border-color: var(--accent-cyan); }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.35rem;
      font-weight: 800;
      user-select: none;
    }

    .brand-logo-mark {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 0 8px rgba(0, 210, 255, 0.22));
    }

    .brand-logo .studio-pill {
      background: rgba(0, 210, 255, 0.12);
      border: 1px solid #00d2ff;
      color: #00d2ff;
      font-size: 0.68rem;
      padding: 0.15rem 0.55rem;
      border-radius: 999px;
      font-weight: 700;
    }

    .search-box {
      flex: 1;
      max-width: 650px;
      position: relative;
    }

    .search-box i {
      position: absolute;
      left: 1.1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .search-box input {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-color);
      padding: 0.65rem 1.25rem 0.65rem 2.6rem;
      border-radius: 999px;
      color: #fff;
      font-size: 0.88rem;
      outline: none;
      transition: all 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      position: relative;
    }

    .add-btn {
      background: var(--accent-cyan);
      color: #040711;
      border: none;
      padding: 0.6rem 1.25rem;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: opacity 0.2s, transform 0.2s;
    }

    .add-btn:hover { opacity: 0.9; transform: translateY(-1px); }

    .profile-pill {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
    }

    .profile-pill .avatar {
      background: #00d2ff;
      color: #000;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 0.75rem;
      font-weight: 800;
    }

    .profile-dropdown {
      position: absolute;
      top: 120%;
      right: 0;
      background: #0b1120;
      border: 1px solid rgba(0, 210, 255, 0.3);
      border-radius: 14px;
      width: 280px;
      padding: 16px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.8);

      flex-direction: column;
      gap: 12px;

    .profile-dropdown.show { display: flex; }

    .profile-dropdown-header {
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }

    .profile-avatar-large {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--accent-cyan);

    .logout-btn-dropdown:hover { background: #ef4444; color: #fff; }

    /* SIDEBAR */
    .sidebar-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(6px); z-index: 99998; display: none;
    }
    .sidebar-overlay.active { display: block; }

    .sidebar-drawer {
      position: fixed; top: 0; left: -320px; width: 310px; height: 100vh; background: #090e1a;
      border-right: 1px solid rgba(0, 210, 255, 0.25); z-index: 99999; display: flex; flex-direction: column;

    }
    .sidebar-drawer.active { left: 0; }

    .sidebar-header {
      padding: 1.25rem 1.5rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color);
    }

    .sidebar-menu { padding: 1.5rem 1rem; display: flex; flex-direction: column; gap: 0.6rem; }

    .sidebar-item {
      display: flex; align-items: center; gap: 1rem; padding: 0.85rem 1.25rem; color: #cbd5e1; border-radius: 10px;
      font-size: 0.95rem; font-weight: 600; transition: all 0.2s; cursor: pointer; background: transparent; border: 1px solid transparent; width: 100%; text-align: left;

    /* VAULT LAYOUT CONTAINER */
    .vault-container {
      max-width: 1332px;
      width: min(1332px, calc(100% - 32px));
      margin: 0 auto;
      padding: 1.5rem 0 5rem;

    /* HERO BANNER */
    .hero-banner-wrapper {
      position: relative; 
      background: #000; 
      border: 1px solid rgba(0, 210, 255, 0.3); 
      border-radius: 20px;
      overflow: hidden; 
      box-shadow: 0 0 50px rgba(0, 150, 255, 0.25); 
      margin-bottom: 2rem; 
      cursor: pointer; 
      transition: border-color 0.4s ease, box-shadow 0.4s ease;
      width: 100%;
      height: 480px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-banner-wrapper:hover {
      border-color: rgba(0, 210, 255, 0.65); 
      box-shadow: 0 0 70px rgba(0, 210, 255, 0.4);
    }

    .hero-foreground-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      z-index: 1;
      background: #000;
    }

    /* CATEGORIES BAR */
    .categories-bar-wrapper {
      position: relative;
      margin-bottom: 2.2rem;
      width: 100%;
    }

    .categories-bar {
      display: flex; 
      align-items: center; 
      gap: 0.85rem; 
      overflow-x: auto; 
      padding-bottom: 0.95rem; 
      scrollbar-width: thin;
      scrollbar-color: var(--accent-cyan) rgba(255, 255, 255, 0.05);
      -webkit-overflow-scrolling: touch;
      width: 100%;
    }

    .categories-bar::-webkit-scrollbar { height: 6px; }
    .categories-bar::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.04); border-radius: 999px; }
    .categories-bar::-webkit-scrollbar-thumb { background: linear-gradient(90deg, #00d2ff 0%, #0088cc 100%); border-radius: 999px; }

    .cat-tab {
      background: rgba(10, 16, 28, 0.85); 
      border: 1px solid rgba(255, 255, 255, 0.08); 
      color: var(--text-muted);
      padding: 0.65rem 1.35rem; 
      border-radius: 999px; 
      font-size: 1.05rem; 
      font-weight: 700; 
      letter-spacing: 0.3px;
      display: flex;
      align-items: center; 
      gap: 0.85rem; 
      cursor: pointer; 
      white-space: nowrap; 
      transition: all 0.25s ease; 
      backdrop-filter: blur(10px);
      user-select: none;
    }

    .cat-tab:hover { border-color: rgba(0, 210, 255, 0.4); background: rgba(0, 210, 255, 0.05); color: #fff; }
    .cat-tab.active {
      background: linear-gradient(135deg, rgba(0, 210, 255, 0.2) 0%, rgba(13, 18, 31, 0.95) 100%);
      border-color: var(--accent-cyan); color: #fff; box-shadow: 0 0 20px rgba(0, 210, 255, 0.25);
    }
    .cat-tab span.count { 
      background: rgba(255, 255, 255, 0.08); 
      padding: 0.2rem 0.65rem; 
      border-radius: 999px; 
      font-size: 0.85rem; 
      font-weight: 800; 
    }
    .cat-tab.active span.count { background: var(--accent-cyan); color: #000; }

    .cat-emoji {
      width:40px; height:40px; flex:0 0 40px; display:inline-grid; place-items:center;
      font-size:25px; filter:drop-shadow(0 4px 8px rgba(0,0,0,.8));
      animation:iconFloatContinuous 3s ease-in-out infinite alternate;
    }

    @keyframes iconFloatContinuous { 0% { transform: translateY(0px) rotate(0deg); } 100% { transform: translateY(-4px) rotate(3deg); } }

    /* CARD GRID */
    .movements-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 1.25rem;
      width: 100%;
      align-items: stretch;
    }

    .movement-card {
      background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 14px; overflow: hidden;
      display: flex; flex-direction: column; transition: transform 0.2s ease, border-color 0.2s ease; position: relative;
    }
    .movement-card:hover { transform: translateY(-4px); border-color: rgba(0, 210, 255, 0.4); box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5); }

    .card-video-box {
      width: 100%; aspect-ratio: 16 / 9; background: #000; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; border-bottom: 1px solid var(--border-color); cursor: pointer;
    }
    .card-video-box video, .card-video-box img, .card-video-box iframe { width: 100%; height: 100%; object-fit: cover; display: none; transition: transform 0.3s ease; border: none; }
    .card-video-box video.active-media, .card-video-box img.active-media, .card-video-box iframe.active-media { display: block; }

    .upload-overlay {
      position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 0.6rem; background: rgba(8, 12, 22, 0.78); border: 2px dashed rgba(0, 210, 255, 0.3); border-radius: 10px; margin: 8px; transition: all 0.25s ease;
    }
    .card-video-box.has-media .upload-overlay { display: none !important; }
    .card-video-box.drag-over .upload-overlay { display: flex !important; background: rgba(0, 210, 255, 0.18); border-color: var(--accent-cyan); }
    .upload-overlay i.cloud-icon { font-size: 1.8rem; color: var(--accent-cyan); }
    .upload-overlay span.upload-txt { font-size: 0.82rem; color: #cbd5e1; font-weight: 600; text-align: center; padding: 0 10px; }

    .link-upload-pill {
      margin-top: 2px;
      background: rgba(0, 210, 255, 0.1);
      border: 1px solid rgba(0, 210, 255, 0.4);
      color: var(--accent-cyan);
      padding: 0.3rem 0.8rem;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .link-upload-pill:hover { background: var(--accent-cyan); color: #040711; transform: translateY(-1px); }

    .file-input { display: none; }

    .card-details { padding: 1.25rem; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; gap: 1rem; }
    .card-meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.25rem; }
    .tag-badge { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; color: var(--accent-cyan); background: rgba(0, 210, 255, 0.08); padding: 0.2rem 0.5rem; border-radius: 6px; border: 1px solid rgba(0, 210, 255, 0.2); }

    .card-meta-actions { display: flex; align-items: center; gap: 7px; }
    .meta-action-btn { width: 30px; height: 30px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.12); background: rgba(255, 255, 255, 0.04); color: #94a3b8; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.82rem; transition: all 0.2s ease; }
    .meta-action-btn:hover { transform: translateY(-2px); }

    .card-details h3 { font-size: 1.15rem; font-weight: 700; color: #fff; margin-bottom: 0.5rem; }

    .prompt-wrapper {
      position: relative;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      min-height: 90px;
      overflow: hidden;
      display: flex;
      align-items: center;
    }

    .prompt-content { width: 100%; padding: 0.85rem 2.4rem 0.85rem 0.85rem; }
    .prompt-box { font-size: 0.86rem; color: #cbd5e1; line-height: 1.5; max-height: 140px; overflow-y: auto; white-space: pre-wrap; word-break: break-word; }

    .copy-btn {
      width: 100%; background: linear-gradient(135deg, #00d2ff 0%, #0099cc 100%); color: #040711; border: none; padding: 0.75rem 1rem; border-radius: 8px; font-size: 0.88rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem; transition: all 0.2s;
    }
    .copy-btn:hover { box-shadow: 0 0 18px rgba(0, 210, 255, 0.5); transform: translateY(-2px); }

    /* AUTHENTICATION GATE MODAL */
    .auth-gate-modal { position: fixed; inset: 0; background: rgba(3, 7, 18, 0.98); backdrop-filter: blur(25px); z-index: 1000000; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
    .auth-card { background: #0c1222; border: 1px solid rgba(0, 210, 255, 0.35); border-radius: 20px; width: 100%; max-width: 440px; padding: 2rem; box-shadow: 0 0 60px rgba(0, 210, 255, 0.2); }
    
    .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.82); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; z-index: 99999; }
    .modal-box { background: #0d121f; border: 1px solid rgba(0, 210, 255, 0.3); border-radius: 16px; width: 92%; max-width: 620px; padding: 24px; color: #fff; max-height: 90vh; overflow-y: auto; }
    .form-group { margin-bottom: 16px; display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 13px; color: #94a3b8; font-weight: 600; }
    .form-group input, .form-group select, .form-group textarea { background: #161e2e; border: 1px solid #334155; color: #f8fafc; padding: 10px 14px; border-radius: 8px; font-size: 14px; outline: none; }
    .submit-btn { width: 100%; padding: 12px; background: var(--accent-cyan); border: none; border-radius: 8px; color: #040711; font-weight: 700; cursor: pointer; }

    /* GEMINI AI ASSISTANT */
    .gemini-launcher {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 7px 13px; border-radius: 999px; border: 1px solid rgba(155,114,203,.48); background: rgba(255,255,255,.045); color: #f8fafc; font: 700 .82rem 'Plus Jakarta Sans',sans-serif; cursor: pointer;
    }
    .gemini-panel {
      position: fixed; z-index: 1000001; top: 82px; right: 22px; bottom: 18px; width: min(410px, calc(100vw - 28px)); max-height: 780px; display: none; flex-direction: column; overflow: hidden; background: #0c1220; border: 1px solid rgba(155,114,203,.38); border-radius: 18px; box-shadow: 0 22px 70px rgba(0,0,0,.65);
    }
    .gemini-panel.open { display: flex; }
    .gemini-panel-head { min-height: 66px; padding: 13px 16px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid rgba(255,255,255,.09); }
    .gemini-messages { flex:1; min-height:80px; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:12px; }
    .gemini-message { max-width:92%; padding:11px 13px; border-radius:13px; font-size:.8rem; line-height:1.6; white-space:pre-wrap; }

<body>

  <!-- PRIVATE AUTHENTICATION GATE (ONLY YOU CAN ACCESS) -->
  <div id="authGateModal" class="auth-gate-modal">
    <div class="auth-card">
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <h2 style="font-family: 'Space Grotesk', sans-serif; font-size: 1.4rem; color: #fff;">🔒 PRIVATE VAULT</h2>
        <p style="font-size: 0.78rem; color: var(--text-muted); margin-top: 4px;">Sign in with your authorized admin account</p>
      </div>
      <form id="emailAuthForm">

  <!-- CORE SCRIPT -->
  <script>
    const defaultMovements = [
      { id: "mov_1", name: "Slow Dolly In", category: "Camera Movement", prompt: "Slow dolly in, camera moves slowly forward toward the subject." },
      { id: "mov_2", name: "Slow Dolly Out", category: "Camera Movement", prompt: "Slow dolly out, camera moves slowly backwards away from the subject." }
    ];
    window.allVaultItems = [...defaultMovements];

    const grid = document.getElementById('movementsGrid');
    function renderCards(list) {
      if (!grid) return;
      grid.innerHTML = list.map(item => `
        <div class="movement-card" id="card_${item.id}">
          <div class="card-video-box"></div>
          <div class="card-details">
            <div>
              <span class="tag-badge">${item.category}</span>
              <h3>${item.name}</h3>
              <div class="prompt-wrapper">
                <div class="prompt-content">
                  <p class="prompt-box" id="text_${item.id}">${item.prompt}</p>
                </div>
              </div>
            </div>
            <button class="copy-btn" onclick="copyCardPrompt('${item.id}')">
              <i class="fa-solid fa-copy"></i> Copy Prompt
            </button>
          </div>
        </div>
      `).join('');
    }

    async function copyPromptText(text) {
      await navigator.clipboard.writeText(text);
      const t = document.getElementById('toast');
      t.style.visibility = 'visible';
      setTimeout(() => t.style.visibility = 'hidden', 2000);
    }
    window.copyCardPrompt = (id) => copyPromptText(document.getElementById(`text_${id}`).innerText);
    renderCards(window.allVaultItems);
  </script>

    async function sendGeminiMessage(prompt) {
      if (!prompt) return;
      const msgs = document.getElementById("geminiMessages");
      const userMsg = document.createElement("div"); userMsg.className = "gemini-message user"; userMsg.textContent = prompt; msgs.appendChild(userMsg);
      
      const aiMsg = document.createElement("div"); aiMsg.className = "gemini-message assistant"; aiMsg.textContent = "Thinking..."; msgs.appendChild(aiMsg);
