<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CINEMOTION STUDIO - AI Film Maker</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-dark: #07090e;
      --card-bg: #0f131c;
      --border-color: rgba(255, 255, 255, 0.08);
      --accent-cyan: #00e5ff;
      --accent-purple: #6366f1;
      --accent-purple-hover: #4f46e5;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Top Navigation Header */
    header {
      background: rgba(7, 9, 14, 0.9);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 1440px;
      margin: 0 auto;
      padding: 0.85rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }

    .menu-icon {
      font-size: 1.25rem;
      color: var(--text-muted);
      cursor: pointer;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: 0.5px;
    }

    .brand-logo .studio-pill {
      background: rgba(0, 229, 255, 0.12);
      border: 1px solid rgba(0, 229, 255, 0.4);
      color: var(--accent-cyan);
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
    }

    .search-bar {
      flex: 1;
      max-width: 580px;
      position: relative;
    }

    .search-bar i {
      position: absolute;
      left: 1.1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .search-bar input {
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 0.65rem 1rem 0.65rem 2.6rem;
      border-radius: 999px;
      color: #fff;
      font-size: 0.88rem;
      outline: none;
      transition: all 0.2s;
    }

    .search-bar input:focus {
      border-color: rgba(0, 229, 255, 0.4);
      background: rgba(255, 255, 255, 0.05);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .btn-add {
      background: var(--accent-cyan);
      color: #040810;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 0.6rem 1.15rem;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: transform 0.15s, opacity 0.2s;
    }

    .btn-add:hover { opacity: 0.9; transform: scale(1.02); }

    .user-profile {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      padding: 0.35rem 0.65rem;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* Main Container */
    main {
      max-width: 1440px;
      margin: 0 auto;
      padding: 1.5rem 1.5rem 5rem;
    }

    /* Hero Banner matching image */
    .hero-card {
      position: relative;
      background: radial-gradient(circle at 80% 20%, rgba(0, 229, 255, 0.12) 0%, transparent 60%),
                  radial-gradient(circle at 20% 80%, rgba(99, 102, 241, 0.15) 0%, transparent 60%),
                  #0c101a;
      border: 1px solid rgba(0, 229, 255, 0.2);
      border-radius: 20px;
      padding: 2.25rem 2.5rem;
      margin-bottom: 2rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      overflow: hidden;
    }

    .hero-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .vault-tag {
      background: rgba(0, 229, 255, 0.08);
      border: 1px solid rgba(0, 229, 255, 0.3);
      color: var(--accent-cyan);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
    }

    .counter-pill {
      background: rgba(0, 229, 255, 0.12);
      border: 1px solid rgba(0, 229, 255, 0.3);
      padding: 0.4rem 0.9rem;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .counter-pill .num {
      color: var(--accent-cyan);
      font-weight: 800;
      font-size: 1.1rem;
    }

    .counter-pill .label {
      color: var(--text-muted);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .hero-graphic-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem 0;
    }

    .hero-graphic-wrap img {
      max-width: 100%;
      height: auto;
      max-height: 240px;
      filter: drop-shadow(0 15px 30px rgba(0,0,0,0.6));
    }

    .hero-bottom-text {
      color: var(--text-muted);
      font-size: 0.95rem;
      max-width: 700px;
      line-height: 1.5;
    }

    /* Category Filter Tabs matching image */
    .categories-bar {
      display: flex;
      gap: 0.75rem;
      overflow-x: auto;
      padding-bottom: 1.25rem;
      margin-bottom: 2rem;
      scrollbar-width: none;
    }

    .categories-bar::-webkit-scrollbar { display: none; }

    .cat-tab {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 0.65rem 1.25rem;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .cat-tab.active {
      background: rgba(0, 229, 255, 0.12);
      border-color: var(--accent-cyan);
      color: #fff;
    }

    .cat-tab .tab-badge {
      background: rgba(255, 255, 255, 0.08);
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      font-size: 0.75rem;
    }

    .cat-tab.active .tab-badge {
      background: var(--accent-cyan);
      color: #040810;
      font-weight: 700;
    }

    /* AIShotStudio Style Cards Grid */
    .movements-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(99, 102, 241, 0.5);
    }

    /* 16:9 Video Box with Direct Upload */
    .video-wrapper {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
    }

    .video-wrapper video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .video-wrapper video.active-video {
      display: block;
    }

    .upload-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      background: rgba(0, 0, 0, 0.65);
      transition: background 0.2s;
    }

    .video-wrapper:hover .upload-overlay {
      background: rgba(0, 0, 0, 0.4);
    }

    .upload-overlay i {
      font-size: 1.6rem;
      color: var(--accent-purple);
    }

    .upload-overlay span {
      font-size: 0.75rem;
      color: #cbd5e1;
      font-weight: 600;
    }

    .file-input { display: none; }

    /* Card Details */
    .card-content {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
      gap: 1.1rem;
    }

    .card-meta h3 {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.45rem;
    }

    .card-meta p {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.45;
    }

    /* AIShotStudio Style Action Button */
    .btn-generate {
      background: var(--accent-purple);
      color: #fff;
      border: none;
      padding: 0.65rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      transition: background 0.2s;
      width: 100%;
    }

    .btn-generate:hover {
      background: var(--accent-purple-hover);
    }

    /* Fixed Floating Right Icons */
    .floating-bar {
      position: fixed;
      right: 1.25rem;
      bottom: 2rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      z-index: 90;
    }

    .floating-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #181c27;
      border: 1px solid var(--border-color);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    /* Toast Notification */
    #toast {
      visibility: hidden;
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #10b981;
      color: #fff;
      padding: 0.75rem 1.4rem;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
    }

    #toast.show {
      visibility: visible;
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <!-- Top Header Navigation -->
  <header>
    <div class="header-inner">
      <div class="header-left">
        <i class="fa-solid fa-bars menu-icon"></i>
        <div class="brand-logo">
          <span>CINEMOTION</span>
          <span class="studio-pill">STUDIO</span>
        </div>
      </div>

      <div class="search-bar">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Search camera motion, prompt formula, angle..." onkeyup="filterMovements()">
      </div>

      <div class="header-right">
        <button class="btn-add"><i class="fa-solid fa-plus"></i> Add Movement</button>
        <div class="user-profile">
          <span>BP</span>
          <i class="fa-solid fa-chevron-down" style="font-size: 0.75rem;"></i>
        </div>
      </div>
    </div>
  </header>

  <main>
    <!-- Master Directors Vault Hero Banner -->
    <div class="hero-card">
      <div class="hero-top-row">
        <div class="vault-tag">MASTER DIRECTORS VAULT</div>
        <div class="counter-pill">
          <span class="num">44</span>
          <span class="label">MOVEMENTS</span>
        </div>
      </div>

      <div class="hero-graphic-wrap">
        <img src="bhanu-3d-header_2.png" alt="Hello, Bhanu Pakala" onerror="this.src='https://raw.githubusercontent.com/bhanuani/bhanu-ai-film-maker/main/bhanu-3d-header_2.png'">
      </div>

      <div class="hero-bottom-text">
        Cinematic camera movements and visual prompt formulas. Select, customize, and clone camera motions seamlessly.
      </div>
    </div>

    <!-- Category Tabs Filter -->
    <div class="categories-bar">
      <div class="cat-tab" onclick="switchCategory('all', this)">
        <i class="fa-solid fa-border-all"></i>
        <span>All</span>
        <span class="tab-badge">44</span>
      </div>
      <div class="cat-tab active" onclick="switchCategory('Camera Movement', this)">
        <i class="fa-solid fa-video"></i>
        <span>Camera Movements</span>
        <span class="tab-badge">44</span>
      </div>
      <div class="cat-tab" onclick="switchCategory('Camera Angles', this)">
        <i class="fa-solid fa-arrows-to-dot"></i>
        <span>Camera Angles</span>
        <span class="tab-badge">0</span>
      </div>
      <div class="cat-tab" onclick="switchCategory('Camera Shots', this)">
        <i class="fa-solid fa-film"></i>
        <span>Camera Shots</span>
        <span class="tab-badge">0</span>
      </div>
      <div class="cat-tab" onclick="switchCategory('Cinematic Lighting', this)">
        <i class="fa-solid fa-lightbulb"></i>
        <span>Cinematic Lighting</span>
        <span class="tab-badge">0</span>
      </div>
      <div class="cat-tab" onclick="switchCategory('Atmosphere', this)">
        <i class="fa-solid fa-smog"></i>
        <span>Atmosphere</span>
        <span class="tab-badge">0</span>
      </div>
    </div>

    <!-- AIShotStudio-style Cards Grid -->
    <div class="movements-grid" id="gridContainer"></div>
  </main>

  <!-- Right Floating Utilities -->
  <div class="floating-bar">
    <div class="floating-btn"><i class="fa-solid fa-book-open"></i></div>
    <div class="floating-btn"><i class="fa-solid fa-tower-broadcast"></i></div>
    <div class="floating-btn"><i class="fa-solid fa-shapes"></i></div>
    <div class="floating-btn"><i class="fa-solid fa-circle-half-stroke"></i></div>
  </div>

  <!-- Toast Notification -->
  <div id="toast">
    <i class="fa-solid fa-check"></i>
    <span>Prompt copied to clipboard!</span>
  </div>

  <script>
    const cameraMovements = [
      { id: "mov_1", name: "Slow Dolly In", category: "Camera Movement", prompt: "Slow dolly in, camera moves slowly forward toward the subject." },
      { id: "mov_2", name: "Slow Dolly Out", category: "Camera Movement", prompt: "Slow dolly out, camera moves slowly backwards away from the subject." },
      { id: "mov_3", name: "Fast Dolly In", category: "Camera Movement", prompt: "Fast dolly in, camera moves rapidly forward toward the subject, urgent motion." },
      { id: "mov_4", name: "Vertigo Effect (Zolly)", category: "Camera Movement", prompt: "Vertigo effect, dolly zoom, camera moves backward while zooming in, background expands." },
      { id: "mov_5", name: "Extreme Macro Zoom", category: "Camera Movement", prompt: "Extreme macro zoom, zoom transition from subject to micro details of surface." },
      { id: "mov_6", name: "Cosmic Hyper Zoom", category: "Camera Movement", prompt: "Cosmic hyper zoom, fast zoom transition from extreme wide view down to macro level." },
      { id: "mov_7", name: "Over the Shoulder (OTS) Shot", category: "Camera Movement", prompt: "Over the shoulder shot, camera mounted behind subject A framing subject B." },
      { id: "mov_8", name: "Fisheye or Peephole Lens", category: "Camera Movement", prompt: "Fisheye lens, extreme wide-angle distortion, circular frame." },
      { id: "mov_9", name: "Reveal from Behind", category: "Camera Movement", prompt: "Wipe movement, camera slides laterally from behind foreground object to reveal the scene." },
      { id: "mov_10", name: "Through Shot", category: "Camera Movement", prompt: "Fly through, camera moves through an opening into the scene." },
      { id: "mov_11", name: "Reveal from Blur", category: "Camera Movement", prompt: "Rack focus, start completely out of focus, slowly pull focus until sharp." },
      { id: "mov_12", name: "Rack Focus", category: "Camera Movement", prompt: "Rack focus, focus shifts from the foreground object to the background subject." },
      { id: "mov_13", name: "Tilt Up", category: "Camera Movement", prompt: "Tilt up, camera pans vertically up from bottom to top." },
      { id: "mov_14", name: "Tilt Down", category: "Camera Movement", prompt: "Tilt down, camera pans vertically down from top to bottom." },
      { id: "mov_15", name: "Camera Truck Left", category: "Camera Movement", prompt: "Truck left, camera moves sideways on a track to the left." },
      { id: "mov_16", name: "Lateral Truck Right", category: "Camera Movement", prompt: "Truck right, camera moves sideways on a track to the right." },
      { id: "mov_17", name: "Orbit 180 (Spin)", category: "Camera Movement", prompt: "Orbit 180, camera moves in a half-circle around the subject." },
      { id: "mov_18", name: "Fast 360 Orbit (Spin)", category: "Camera Movement", prompt: "Fast 360 orbit, camera spins rapidly 360 degrees around the subject." },
      { id: "mov_19", name: "True Orbit 180", category: "Camera Movement", prompt: "180 orbit, camera orbits 180 degrees around the [subject]." },
      { id: "mov_20", name: "True Orbit 360", category: "Camera Movement", prompt: "Fast 360 orbit, camera orbits 360 degrees around the [subject]." },
      { id: "mov_21", name: "Slow Cinematic Arc", category: "Camera Movement", prompt: "Slow cinematic arc, camera moves in a wide curve to reveal side profile." },
      { id: "mov_22", name: "Pedestal Down", category: "Camera Movement", prompt: "Pedestal down, camera lowers vertically straight down." },
      { id: "mov_23", name: "Pedestal Up", category: "Camera Movement", prompt: "Pedestal up, camera rises vertically straight up from waist to eye level." },
      { id: "mov_24", name: "Crane Up (High Angle Reveal)", category: "Camera Movement", prompt: "Crane up, camera lifts high into the air." },
      { id: "mov_25", name: "Crane Down (Landing)", category: "Camera Movement", prompt: "Crane down, camera descends slowly to the subject." },
      { id: "mov_26", name: "Smooth Optical Zoom In", category: "Camera Movement", prompt: "Smooth optical zoom in, lens magnifies subject, camera stays stationary." },
      { id: "mov_27", name: "Smooth Optical Zoom Out", category: "Camera Movement", prompt: "Smooth optical zoom out, lens widens, background becomes blurry." },
      { id: "mov_28", name: "Snap Zoom (Crash Zoom)", category: "Camera Movement", prompt: "Snap zoom, crash zoom, rapid zoom directly into the eyes." },
      { id: "mov_29", name: "Drone Fly Over", category: "Camera Movement", prompt: "Drone fly over, high altitude flight moving forward over the landscape." },
      { id: "mov_30", name: "Epic Drone Reveal", category: "Camera Movement", prompt: "Epic drone reveal, rising and tilting down to reveal the scene." },
      { id: "mov_31", name: "Large Scale Drone Orbit", category: "Camera Movement", prompt: "Large scale drone orbit, massive sweeping circle around the landscape." },
      { id: "mov_32", name: "Top Down (God's Eye View)", category: "Camera Movement", prompt: "Top down shot, camera pointing straight down, slow twist." },
      { id: "mov_33", name: "FPV Drone Aggressive (Drone Dive)", category: "Camera Movement", prompt: "FPV drone dive, aggressive diving motion down a vertical structure." },
      { id: "mov_34", name: "Handheld Documentary Style", category: "Camera Movement", prompt: "Handheld camera, shaky motion, natural movement, documentary style." },
      { id: "mov_35", name: "Whip Pan", category: "Camera Movement", prompt: "Whip pan, camera whips violently to the side with extreme directional motion blur." },
      { id: "mov_36", name: "Dutch Angle (Roll)", category: "Camera Movement", prompt: "Dutch angle, camera roll, tilted sideways on Z-axis." },
      { id: "mov_37", name: "Leading Shot (Backward Tracking)", category: "Camera Movement", prompt: "Leading shot, camera moves backward matching the subject's speed." },
      { id: "mov_38", name: "Following Shot (Forward Tracking)", category: "Camera Movement", prompt: "Following shot, camera follows behind the subject matching speed." },
      { id: "mov_39", name: "Side Tracking (Parallel)", category: "Camera Movement", prompt: "Side tracking, camera trucks alongside the subject." },
      { id: "mov_40", name: "POV Walk (First Person Walk)", category: "Camera Movement", prompt: "POV walk, first person camera moving forward with bobbing motion." },
      { id: "mov_41", name: "Hyperlapse (Moving Time-Lapse)", category: "Camera Movement", prompt: "Hyperlapse, camera moves forward rapidly, time accelerated, fast motion, light trails." },
      { id: "mov_42", name: "Barrel Roll (Vortex Inception Shot)", category: "Camera Movement", prompt: "Barrel roll, camera spins 360 degrees clockwise while moving forward, disorienting." },
      { id: "mov_43", name: "Bullet Time (Frozen Moment)", category: "Camera Movement", prompt: "Bullet time, frozen moment, ultra slow motion, camera orbit right." },
      { id: "mov_44", name: "Worm's Eye Tracking (Ground Level)", category: "Camera Movement", prompt: "Worm's eye view, low angle tracking, camera moves along the ground looking up." }
    ];

    let currentCategory = "Camera Movement";

    // IndexedDB for local video saving
    let db;
    const req = indexedDB.open("CinemotionVaultDB", 1);
    req.onupgradeneeded = (e) => {
      db = e.target.result;
      if (!db.objectStoreNames.contains("videos")) {
        db.createObjectStore("videos", { keyPath: "id" });
      }
    };
    req.onsuccess = (e) => {
      db = e.target.result;
      renderCards(cameraMovements);
    };

    const container = document.getElementById('gridContainer');

    function renderCards(list) {
      if (list.length === 0) {
        container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 3rem 0;">No items found in this category.</div>`;
        return;
      }

      container.innerHTML = list.map(item => `
        <div class="card" id="card_${item.id}">
          <div class="video-wrapper" onclick="triggerUpload('${item.id}')">
            <video id="vid_${item.id}" autoplay loop muted playsinline></video>
            <div class="upload-overlay" id="overlay_${item.id}">
              <i class="fa-solid fa-cloud-arrow-up"></i>
              <span>Upload Video</span>
            </div>
            <input type="file" class="file-input" id="input_${item.id}" accept="video/*" onchange="saveAndPlayVideo(event, '${item.id}')">
          </div>
          <div class="card-content">
            <div class="card-meta">
              <h3>${item.name}</h3>
              <p>${item.prompt}</p>
            </div>
            <button class="btn-generate" onclick="copyPromptText('${item.prompt.replace(/'/g, "\\'")}')">
              <i class="fa-solid fa-bolt"></i> Generate
            </button>
          </div>
        </div>
      `).join('');

      // Restore saved local videos
      if (db) {
        const tx = db.transaction("videos", "readonly");
        const store = tx.objectStore("videos");
        list.forEach(item => {
          const r = store.get(item.id);
          r.onsuccess = () => {
            if (r.result && r.result.file) {
              setVideoSource(item.id, r.result.file);
            }
          };
        });
      }
    }

    function triggerUpload(id) {
      document.getElementById(`input_${id}`).click();
    }

    function saveAndPlayVideo(event, id) {
      const file = event.target.files[0];
      if (file) {
        setVideoSource(id, file);
        if (db) {
          const tx = db.transaction("videos", "readwrite");
          tx.objectStore("videos").put({ id: id, file: file });
        }
      }
    }

    function setVideoSource(id, blobOrFile) {
      const vid = document.getElementById(`vid_${id}`);
      const overlay = document.getElementById(`overlay_${id}`);
      if (vid && overlay) {
        vid.src = URL.createObjectURL(blobOrFile);
        vid.classList.add('active-video');
        overlay.style.opacity = '0';
        overlay.onmouseenter = () => overlay.style.opacity = '1';
        overlay.onmouseleave = () => overlay.style.opacity = '0';
      }
    }

    function copyPromptText(text) {
      navigator.clipboard.writeText(text).then(() => {
        const toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
      });
    }

    function switchCategory(cat, tabElement) {
      currentCategory = cat;
      document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
      tabElement.classList.add('active');

      if (cat === 'all') {
        renderCards(cameraMovements);
      } else if (cat === 'Camera Movement') {
        renderCards(cameraMovements);
      } else {
        renderCards([]); // Keep other categories clean at 0 as shown in image
      }
    }

    function filterMovements() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const filtered = cameraMovements.filter(m => 
        m.name.toLowerCase().includes(q) || m.prompt.toLowerCase().includes(q)
      );
      renderCards(filtered);
    }
  </script>
</body>
</html>
