<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CINEMOTION STUDIO - Master Directors Vault</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-dark: #07090e;
      --panel-bg: #0f121d;
      --card-bg: #141724;
      --border-color: rgba(255, 255, 255, 0.08);
      --accent-cyan: #00e5ff;
      --accent-blue: #3b82f6;
      --accent-glow: rgba(0, 229, 255, 0.25);
      --text-main: #f8fafc;
      --text-muted: #8e9bb0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Top Navigation Header */
    header {
      background: rgba(11, 14, 23, 0.95);
      border-bottom: 1px solid var(--border-color);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .header-inner {
      max-width: 1440px;
      margin: 0 auto;
      padding: 0.85rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
    }

    .brand-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .menu-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: #fff;
      width: 38px;
      height: 38px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 1.3rem;
      letter-spacing: 0.5px;
    }

    .studio-pill {
      background: rgba(0, 229, 255, 0.12);
      border: 1px solid var(--accent-cyan);
      color: var(--accent-cyan);
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.15rem 0.55rem;
      border-radius: 999px;
      letter-spacing: 0.5px;
    }

    .search-container {
      flex: 1;
      max-width: 600px;
      position: relative;
    }

    .search-container i {
      position: absolute;
      left: 1.1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .search-container input {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-color);
      padding: 0.65rem 1rem 0.65rem 2.6rem;
      border-radius: 999px;
      color: #fff;
      font-size: 0.88rem;
      outline: none;
      transition: all 0.2s;
    }

    .search-container input:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .add-btn {
      background: var(--accent-cyan);
      color: #05070b;
      border: none;
      padding: 0.6rem 1.1rem;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .user-profile {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      border-radius: 999px;
      padding: 0.35rem 0.65rem 0.35rem 0.4rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
    }

    .user-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
      color: #fff;
    }

    /* Main Container */
    main {
      max-width: 1440px;
      margin: 0 auto;
      padding: 1.5rem;
    }

    /* Hero Banner Area */
    .hero-banner {
      background: #0b0e18;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      position: relative;
      overflow: hidden;
      margin-bottom: 2rem;
    }

    .hero-top-badges {
      padding: 1.25rem 1.5rem 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .vault-tag {
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      background: rgba(56, 189, 248, 0.08);
      padding: 0.3rem 0.8rem;
      border-radius: 999px;
    }

    .counter-badge {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(0, 229, 255, 0.1);
      border: 1px solid rgba(0, 229, 255, 0.3);
      padding: 0.3rem 0.8rem;
      border-radius: 999px;
      color: var(--accent-cyan);
      font-size: 0.8rem;
      font-weight: 800;
    }

    .hero-image-box {
      width: 100%;
      height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: radial-gradient(circle at center, rgba(14, 165, 233, 0.15) 0%, transparent 70%);
    }

    .hero-image-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .hero-caption {
      padding: 1rem 1.5rem 1.25rem;
      color: var(--text-muted);
      font-size: 0.88rem;
    }

    /* Category Filter Tabs Bar */
    .categories-bar {
      display: flex;
      gap: 0.75rem;
      overflow-x: auto;
      padding-bottom: 1rem;
      margin-bottom: 1.5rem;
      scrollbar-width: none;
    }

    .categories-bar::-webkit-scrollbar { display: none; }

    .cat-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 0.55rem 1.1rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .cat-btn.active {
      background: rgba(0, 229, 255, 0.1);
      border-color: var(--accent-cyan);
      color: #fff;
      box-shadow: 0 0 14px var(--accent-glow);
    }

    .cat-btn .badge {
      background: rgba(255, 255, 255, 0.1);
      font-size: 0.72rem;
      padding: 0.1rem 0.45rem;
      border-radius: 999px;
    }

    .cat-btn.active .badge {
      background: var(--accent-cyan);
      color: #000;
      font-weight: 700;
    }

    /* AIShotStudio Style Cards Grid */
    .movements-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(0, 229, 255, 0.4);
    }

    .video-viewport {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #090b12;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .video-viewport video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .video-viewport video.active-video {
      display: block;
    }

    .video-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      background: rgba(0, 0, 0, 0.65);
      cursor: pointer;
      transition: all 0.2s;
    }

    .video-viewport:hover .video-overlay {
      background: rgba(0, 0, 0, 0.4);
    }

    .video-overlay i {
      font-size: 1.5rem;
      color: var(--accent-cyan);
    }

    .video-overlay span {
      font-size: 0.75rem;
      color: #cbd5e1;
      font-weight: 500;
    }

    .file-input { display: none; }

    .card-body {
      padding: 1.15rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
      gap: 0.9rem;
    }

    .card-info h3 {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
      color: #fff;
    }

    .card-info p {
      font-size: 0.83rem;
      color: var(--text-muted);
      line-height: 1.45;
      background: rgba(0, 0, 0, 0.2);
      padding: 0.6rem;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.03);
    }

    .copy-action-btn {
      background: rgba(255, 255, 255, 0.04);
      color: #fff;
      border: 1px solid var(--border-color);
      padding: 0.6rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s;
    }

    .copy-action-btn:hover {
      background: var(--accent-cyan);
      color: #000;
      border-color: var(--accent-cyan);
    }

    /* Notification Toast */
    #toast {
      visibility: hidden;
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: #10b981;
      color: #fff;
      padding: 0.7rem 1.2rem;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      z-index: 2000;
      opacity: 0;
      transition: all 0.3s;
      transform: translateY(15px);
    }

    #toast.show {
      visibility: visible;
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="header-inner">
      <div class="brand-left">
        <button class="menu-btn"><i class="fa-solid fa-bars"></i></button>
        <div class="brand-logo">
          <span>CINEMOTION</span>
          <span class="studio-pill">STUDIO</span>
        </div>
      </div>

      <div class="search-container">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Search camera motion, prompt formula, angle..." onkeyup="filterMovements()">
      </div>

      <div class="header-right">
        <button class="add-btn"><i class="fa-solid fa-plus"></i> Add Movement</button>
        <div class="user-profile">
          <div class="user-avatar">BP</div>
          <i class="fa-solid fa-chevron-down" style="font-size: 0.7rem; color: var(--text-muted);"></i>
        </div>
      </div>
    </div>
  </header>

  <main>
    <!-- Hello BHANU PAKALA 3D Hero Banner -->
    <section class="hero-banner">
      <div class="hero-top-badges">
        <span class="vault-tag">MASTER DIRECTORS VAULT</span>
        <div class="counter-badge">
          <span id="counterNum">44</span> MOVEMENTS
        </div>
      </div>

      <div class="hero-image-box">
        <img src="bhanu-3d-header_2.png" alt="Hello, BHANU PAKALA - Cinematic 3D Scene">
      </div>

      <div class="hero-caption">
        Cinematic camera movements and visual prompt formulas. Select, customize, and clone camera motions seamlessly.
      </div>
    </section>

    <!-- Categories Tabs Filter Bar -->
    <div class="categories-bar">
      <button class="cat-btn" onclick="selectCategory('all', this)"><i class="fa-solid fa-border-all"></i> All <span class="badge">44</span></button>
      <button class="cat-btn active" onclick="selectCategory('Camera Movement', this)"><i class="fa-solid fa-video"></i> Camera Movements <span class="badge">44</span></button>
      <button class="cat-btn" onclick="selectCategory('Camera Angles', this)"><i class="fa-solid fa-compass"></i> Camera Angles <span class="badge">0</span></button>
      <button class="cat-btn" onclick="selectCategory('Camera Shots', this)"><i class="fa-solid fa-film"></i> Camera Shots <span class="badge">0</span></button>
      <button class="cat-btn" onclick="selectCategory('Cinematic Lighting', this)"><i class="fa-solid fa-lightbulb"></i> Cinematic Lighting <span class="badge">0</span></button>
      <button class="cat-btn" onclick="selectCategory('Atmosphere', this)"><i class="fa-solid fa-smog"></i> Atmosphere <span class="badge">0</span></button>
    </div>

    <!-- AIShotStudio 44 Movements Grid -->
    <div class="movements-grid" id="movementsGrid"></div>
  </main>

  <div id="toast">
    <i class="fa-solid fa-circle-check"></i>
    <span>Prompt copied to clipboard!</span>
  </div>

  <script>
    const cameraMovements = [
      { id: "cm_1", name: "Slow Dolly In", category: "Camera Movement", prompt: "Slow dolly in, camera moves slowly forward toward the subject." },
      { id: "cm_2", name: "Slow Dolly Out", category: "Camera Movement", prompt: "Slow dolly out, camera moves slowly backwards away from the subject." },
      { id: "cm_3", name: "Fast Dolly In", category: "Camera Movement", prompt: "Fast dolly in, camera moves rapidly forward toward the subject, urgent motion." },
      { id: "cm_4", name: "Vertigo Effect (Zolly)", category: "Camera Movement", prompt: "Vertigo effect, dolly zoom, camera moves backward while zooming in, background expands." },
      { id: "cm_5", name: "Extreme Macro Zoom", category: "Camera Movement", prompt: "Extreme macro zoom, zoom transition from subject to micro details of surface." },
      { id: "cm_6", name: "Cosmic Hyper Zoom", category: "Camera Movement", prompt: "Cosmic hyper zoom, fast zoom transition from extreme wide view down to macro level." },
      { id: "cm_7", name: "Over the Shoulder (OTS) Shot", category: "Camera Movement", prompt: "Over the shoulder shot, camera mounted behind subject A framing subject B." },
      { id: "cm_8", name: "Fisheye or Peephole Lens", category: "Camera Movement", prompt: "Fisheye lens, extreme wide-angle distortion, circular frame." },
      { id: "cm_9", name: "Reveal from Behind", category: "Camera Movement", prompt: "Wipe movement, camera slides laterally from behind foreground object to reveal the scene." },
      { id: "cm_10", name: "Through Shot", category: "Camera Movement", prompt: "Fly through, camera moves through an opening into the scene." },
      { id: "cm_11", name: "Reveal from Blur", category: "Camera Movement", prompt: "Rack focus, start completely out of focus, slowly pull focus until sharp." },
      { id: "cm_12", name: "Rack Focus", category: "Camera Movement", prompt: "Rack focus, focus shifts from the foreground object to the background subject." },
      { id: "cm_13", name: "Tilt Up", category: "Camera Movement", prompt: "Tilt up, camera pans vertically up from bottom to top." },
      { id: "cm_14", name: "Tilt Down", category: "Camera Movement", prompt: "Tilt down, camera pans vertically down from top to bottom." },
      { id: "cm_15", name: "Camera Truck Left", category: "Camera Movement", prompt: "Truck left, camera moves sideways on a track to the left." },
      { id: "cm_16", name: "Lateral Truck Right", category: "Camera Movement", prompt: "Truck right, camera moves sideways on a track to the right." },
      { id: "cm_17", name: "Orbit 180 (Spin)", category: "Camera Movement", prompt: "Orbit 180, camera moves in a half-circle around the subject." },
      { id: "cm_18", name: "Fast 360 Orbit (Spin)", category: "Camera Movement", prompt: "Fast 360 orbit, camera spins rapidly 360 degrees around the subject." },
      { id: "cm_19", name: "True Orbit 180", category: "Camera Movement", prompt: "180 orbit, camera orbits 180 degrees around the [subject]." },
      { id: "cm_20", name: "True Orbit 360", category: "Camera Movement", prompt: "Fast 360 orbit, camera orbits 360 degrees around the [subject]." },
      { id: "cm_21", name: "Slow Cinematic Arc", category: "Camera Movement", prompt: "Slow cinematic arc, camera moves in a wide curve to reveal side profile." },
      { id: "cm_22", name: "Pedestal Down", category: "Camera Movement", prompt: "Pedestal down, camera lowers vertically straight down." },
      { id: "cm_23", name: "Pedestal Up", category: "Camera Movement", prompt: "Pedestal up, camera rises vertically straight up from waist to eye level." },
      { id: "cm_24", name: "Crane Up (High Angle Reveal)", category: "Camera Movement", prompt: "Crane up, camera lifts high into the air." },
      { id: "cm_25", name: "Crane Down (Landing)", category: "Camera Movement", prompt: "Crane down, camera descends slowly to the subject." },
      { id: "cm_26", name: "Smooth Optical Zoom In", category: "Camera Movement", prompt: "Smooth optical zoom in, lens magnifies subject, camera stays stationary." },
      { id: "cm_27", name: "Smooth Optical Zoom Out", category: "Camera Movement", prompt: "Smooth optical zoom out, lens widens, background becomes blurry." },
      { id: "cm_28", name: "Snap Zoom (Crash Zoom)", category: "Camera Movement", prompt: "Snap zoom, crash zoom, rapid zoom directly into the eyes." },
      { id: "cm_29", name: "Drone Fly Over", category: "Camera Movement", prompt: "Drone fly over, high altitude flight moving forward over the landscape." },
      { id: "cm_30", name: "Epic Drone Reveal", category: "Camera Movement", prompt: "Epic drone reveal, rising and tilting down to reveal the scene." },
      { id: "cm_31", name: "Large Scale Drone Orbit", category: "Camera Movement", prompt: "Large scale drone orbit, massive sweeping circle around the landscape." },
      { id: "cm_32", name: "Top Down (God's Eye View)", category: "Camera Movement", prompt: "Top down shot, camera pointing straight down, slow twist." },
      { id: "cm_33", name: "FPV Drone Aggressive (Drone Dive)", category: "Camera Movement", prompt: "FPV drone dive, aggressive diving motion down a vertical structure." },
      { id: "cm_34", name: "Handheld Documentary Style", category: "Camera Movement", prompt: "Handheld camera, shaky motion, natural movement, documentary style." },
      { id: "cm_35", name: "Whip Pan", category: "Camera Movement", prompt: "Whip pan, camera whips violently to the side with extreme directional motion blur." },
      { id: "cm_36", name: "Dutch Angle (Roll)", category: "Camera Movement", prompt: "Dutch angle, camera roll, tilted sideways on Z-axis." },
      { id: "cm_37", name: "Leading Shot (Backward Tracking)", category: "Camera Movement", prompt: "Leading shot, camera moves backward matching the subject's speed." },
      { id: "cm_38", name: "Following Shot (Forward Tracking)", category: "Camera Movement", prompt: "Following shot, camera follows behind the subject matching speed." },
      { id: "cm_39", name: "Side Tracking (Parallel)", category: "Camera Movement", prompt: "Side tracking, camera trucks alongside the subject." },
      { id: "cm_40", name: "POV Walk (First Person Walk)", category: "Camera Movement", prompt: "POV walk, first person camera moving forward with bobbing motion." },
      { id: "cm_41", name: "Hyperlapse (Moving Time-Lapse)", category: "Camera Movement", prompt: "Hyperlapse, camera moves forward rapidly, time accelerated, fast motion, light trails." },
      { id: "cm_42", name: "Barrel Roll (Vortex Inception Shot)", category: "Camera Movement", prompt: "Barrel roll, camera spins 360 degrees clockwise while moving forward, disorienting." },
      { id: "cm_43", name: "Bullet Time (Frozen Moment)", category: "Camera Movement", prompt: "Bullet time, frozen moment, ultra slow motion, camera orbit right." },
      { id: "cm_44", name: "Worm's Eye Tracking (Ground Level)", category: "Camera Movement", prompt: "Worm's eye view, low angle tracking, camera moves along the ground looking up." }
    ];

    let currentCategory = "Camera Movement";
    const grid = document.getElementById('movementsGrid');

    /* IndexedDB for persisting uploaded videos */
    let db;
    const dbReq = indexedDB.open("CinemotionLocalDB", 1);
    dbReq.onupgradeneeded = (e) => {
      db = e.target.result;
      if (!db.objectStoreNames.contains("videos")) {
        db.createObjectStore("videos", { keyPath: "id" });
      }
    };
    dbReq.onsuccess = (e) => {
      db = e.target.result;
      renderCards();
    };

    function renderCards() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      
      const filtered = cameraMovements.filter(item => {
        const matchesCategory = (currentCategory === 'all' || item.category === currentCategory);
        const matchesQuery = item.name.toLowerCase().includes(q) || item.prompt.toLowerCase().includes(q);
        return matchesCategory && matchesQuery;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 3rem; color: var(--text-muted);">No camera movements found.</div>`;
        return;
      }

      grid.innerHTML = filtered.map(item => `
        <div class="card" id="card_${item.id}">
          <div class="video-viewport" onclick="openUploader('${item.id}')">
            <video id="vid_${item.id}" autoplay loop muted playsinline></video>
            <div class="video-overlay" id="overlay_${item.id}">
              <i class="fa-solid fa-cloud-arrow-up"></i>
              <span>Upload Video</span>
            </div>
            <input type="file" class="file-input" id="input_${item.id}" accept="video/*" onchange="saveVideo(event, '${item.id}')">
          </div>
          <div class="card-body">
            <div class="card-info">
              <h3>${item.name}</h3>
              <p>${item.prompt}</p>
            </div>
            <button class="copy-action-btn" onclick="copyPrompt('${item.prompt.replace(/'/g, "\\'")}')">
              <i class="fa-regular fa-copy"></i> Copy Prompt
            </button>
          </div>
        </div>
      `).join('');

      // Restore saved video streams
      if (db) {
        const tx = db.transaction("videos", "readonly");
        const store = tx.objectStore("videos");
        filtered.forEach(item => {
          const req = store.get(item.id);
          req.onsuccess = () => {
            if (req.result && req.result.file) {
              applyVideoSource(item.id, req.result.file);
            }
          };
        });
      }
    }

    function openUploader(id) {
      document.getElementById(`input_${id}`).click();
    }

    function saveVideo(event, id) {
      const file = event.target.files[0];
      if (file) {
        applyVideoSource(id, file);
        if (db) {
          const tx = db.transaction("videos", "readwrite");
          tx.objectStore("videos").put({ id: id, file: file });
        }
      }
    }

    function applyVideoSource(id, fileBlob) {
      const vid = document.getElementById(`vid_${id}`);
      const overlay = document.getElementById(`overlay_${id}`);
      if (vid && overlay) {
        vid.src = URL.createObjectURL(fileBlob);
        vid.classList.add('active-video');
        overlay.style.opacity = '0';
        overlay.onmouseenter = () => overlay.style.opacity = '1';
        overlay.onmouseleave = () => overlay.style.opacity = '0';
      }
    }

    function selectCategory(cat, btn) {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentCategory = cat;
      renderCards();
    }

    function filterMovements() {
      renderCards();
    }

    function copyPrompt(text) {
      navigator.clipboard.writeText(text).then(() => {
        const toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
      });
    }
  </script>
</body>
