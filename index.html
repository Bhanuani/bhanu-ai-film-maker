<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CINEMOTION STUDIO - Master Directors Vault</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-dark: #040711;
      --card-bg: #0d121f;
      --border-color: rgba(255, 255, 255, 0.08);
      --accent-cyan: #00d2ff;
      --accent-glow: rgba(0, 210, 255, 0.25);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* TOP HEADER */
    header {
      background: rgba(4, 7, 17, 0.95);
      border-bottom: 1px solid var(--border-color);
      backdrop-filter: blur(16px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 1440px;
      margin: 0 auto;
      padding: 0.85rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1.5rem;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }

    .menu-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 0.5rem 0.65rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .brand-logo .studio-pill {
      background: rgba(0, 210, 255, 0.12);
      border: 1px solid #00d2ff;
      color: #00d2ff;
      font-size: 0.68rem;
      padding: 0.15rem 0.55rem;
      border-radius: 999px;
      font-weight: 700;
    }

    .search-box {
      flex: 1;
      max-width: 600px;
      position: relative;
    }

    .search-box i {
      position: absolute;
      left: 1.1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .search-box input {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-color);
      padding: 0.65rem 1.25rem 0.65rem 2.6rem;
      border-radius: 999px;
      color: #fff;
      font-size: 0.88rem;
      outline: none;
      transition: all 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .add-btn {
      background: var(--accent-cyan);
      color: #040711;
      border: none;
      padding: 0.6rem 1.25rem;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: opacity 0.2s;
    }

    .add-btn:hover {
      opacity: 0.9;
    }

    .profile-pill {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
    }

    .profile-pill .avatar {
      background: #00d2ff;
      color: #000;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 0.75rem;
    }

    /* MAIN CONTAINER */
    .vault-container {
      max-width: 1440px;
      margin: 0 auto;
      padding: 1.5rem 2rem 5rem;
    }

    /* HERO 3D BANNER */
    .hero-banner-wrapper {
      position: relative;
      background: #000;
      border: 1px solid rgba(0, 210, 255, 0.25);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 0 45px rgba(0, 150, 255, 0.12);
      margin-bottom: 2rem;
    }

    .hero-top-bar {
      position: absolute;
      top: 1.25rem;
      left: 1.5rem;
      right: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 5;
    }

    .vault-badge {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      background: rgba(0, 210, 255, 0.12);
      border: 1px solid rgba(0, 210, 255, 0.3);
      color: var(--accent-cyan);
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
    }

    .counter-pill {
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(0, 210, 255, 0.3);
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.75rem;
      font-weight: 800;
      color: #fff;
    }

    .counter-pill span.num {
      color: var(--accent-cyan);
      font-size: 1.1rem;
    }

    .hero-img-box {
      width: 100%;
      min-height: 380px;
      max-height: 480px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .hero-bottom-caption {
      padding: 1.25rem 1.75rem;
      background: rgba(8, 12, 22, 0.95);
      border-top: 1px solid var(--border-color);
      font-size: 0.92rem;
      color: var(--text-muted);
    }

    /* CATEGORIES BAR */
    .categories-bar {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      overflow-x: auto;
      padding-bottom: 0.75rem;
      margin-bottom: 2rem;
      scrollbar-width: none;
    }

    .categories-bar::-webkit-scrollbar { display: none; }

    .cat-tab {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 0.65rem 1.25rem;
      border-radius: 999px;
      font-size: 0.86rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .cat-tab span.count {
      background: rgba(255, 255, 255, 0.08);
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      font-size: 0.75rem;
    }

    .cat-tab.active {
      background: rgba(0, 210, 255, 0.1);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
      box-shadow: 0 0 15px rgba(0, 210, 255, 0.15);
    }

    .cat-tab.active span.count {
      background: var(--accent-cyan);
      color: #000;
      font-weight: 700;
    }

    /* MOVEMENTS GRID */
    .movements-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 1.5rem;
    }

    .movement-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .movement-card:hover {
      transform: translateY(-4px);
      border-color: rgba(0, 210, 255, 0.4);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    /* Video area with Direct Upload */
    .card-video-box {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-bottom: 1px solid var(--border-color);
    }

    .card-video-box video, .card-video-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .card-video-box video.active-video, .card-video-box img.active-video {
      display: block;
    }

    .upload-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      background: rgba(0, 0, 0, 0.65);
      cursor: pointer;
      transition: all 0.2s;
    }

    .card-video-box:hover .upload-overlay {
      background: rgba(0, 0, 0, 0.45);
    }

    .upload-overlay i {
      font-size: 1.6rem;
      color: var(--accent-cyan);
    }

    .upload-overlay span {
      font-size: 0.78rem;
      color: #cbd5e1;
      font-weight: 500;
    }

    .file-input { display: none; }

    /* Card Details */
    .card-details {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
      gap: 1rem;
    }

    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.25rem;
    }

    .tag-badge {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--accent-cyan);
      background: rgba(0, 210, 255, 0.08);
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      border: 1px solid rgba(0, 210, 255, 0.2);
    }

    .card-details h3 {
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.5rem;
    }

    .prompt-box {
      font-size: 0.86rem;
      color: var(--text-muted);
      line-height: 1.45;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.04);
      padding: 0.75rem;
      border-radius: 8px;
    }

    .generate-btn {
      background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
      color: #000;
      border: none;
      padding: 0.7rem 1rem;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s;
      width: 100%;
    }

    .generate-btn:hover {
      box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
      transform: translateY(-1px);
    }

    /* Toast */
    #toast {
      visibility: hidden;
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: #10b981;
      color: #fff;
      padding: 0.75rem 1.25rem;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      transform: translateY(20px);
    }

    #toast.show {
      visibility: visible;
      opacity: 1;
      transform: translateY(0);
    }

    /* MODAL POPUP STYLING */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .modal-box {
      background: #0d121f;
      border: 1px solid rgba(0, 210, 255, 0.3);
      border-radius: 16px;
      width: 90%;
      max-width: 520px;
      padding: 24px;
      color: #fff;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }

    .close-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 26px;
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 13px;
      color: #94a3b8;
      font-weight: 600;
    }

    .form-group input, 
    .form-group select, 
    .form-group textarea {
      background: #161e2e;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      font-family: inherit;
    }

    .form-group input:focus, 
    .form-group select:focus, 
    .form-group textarea:focus {
      border-color: var(--accent-cyan);
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      background: var(--accent-cyan);
      border: none;
      border-radius: 8px;
      color: #040711;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.95rem;
      transition: opacity 0.2s;
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="header-inner">
      <div class="brand-group">
        <button class="menu-btn"><i class="fa-solid fa-bars"></i></button>
        <div class="brand-logo">
          <span>CINEMOTION</span>
          <span class="studio-pill">STUDIO</span>
        </div>
      </div>

      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Search camera motion, prompt formula, angle..." onkeyup="filterCards()">
      </div>

      <div class="header-actions">
        <!-- Added ID here -->
        <button class="add-btn" id="addMovementBtn"><i class="fa-solid fa-plus"></i> Add Movement</button>
        <div class="profile-pill">
          <div class="avatar">BP</div>
          <i class="fa-solid fa-chevron-down" style="font-size: 0.7rem; color: #94a3b8;"></i>
        </div>
      </div>
    </div>
  </header>

  <div class="vault-container">

    <!-- HERO SECTION -->
    <section class="hero-banner-wrapper">
      <div class="hero-top-bar">
        <div class="vault-badge">MASTER DIRECTORS VAULT</div>
        <div class="counter-pill">
          <span class="num" id="heroCount">44</span> MOVEMENTS
        </div>
      </div>

      <div class="hero-img-box">
        <img src="bhanu-3d-header_2.png" alt="Hello, Bhanu Pakala - Cinematic 3D Scene" onerror="this.onerror=null; this.src='https://raw.githubusercontent.com/bhanuani/bhanu-ai-film-maker/main/bhanu-3d-header_2.png';">
      </div>

      <div class="hero-bottom-caption">
        Cinematic camera movements and visual prompt formulas. Select, customize, and clone camera motions seamlessly.
      </div>
    </section>

    <!-- CATEGORIES BAR -->
    <div class="categories-bar">
      <button class="cat-tab active" onclick="filterCategory('All', this)">
        <i class="fa-solid fa-border-all"></i> All <span class="count" id="count_All">44</span>
      </button>
      <button class="cat-tab" onclick="filterCategory('Camera Movement', this)">
        <i class="fa-solid fa-video"></i> Camera Movements <span class="count" id="count_Camera_Movement">44</span>
      </button>
      <button class="cat-tab" onclick="filterCategory('Camera Angles', this)">
        <i class="fa-solid fa-compass"></i> Camera Angles <span class="count" id="count_Camera_Angles">0</span>
      </button>
      <button class="cat-tab" onclick="filterCategory('Camera Shots', this)">
        <i class="fa-solid fa-clapperboard"></i> Camera Shots <span class="count" id="count_Camera_Shots">0</span>
      </button>
      <button class="cat-tab" onclick="filterCategory('Cinematic Lighting', this)">
        <i class="fa-solid fa-lightbulb"></i> Cinematic Lighting <span class="count" id="count_Cinematic_Lighting">0</span>
      </button>
      <button class="cat-tab" onclick="filterCategory('Atmosphere', this)">
        <i class="fa-solid fa-smog"></i> Atmosphere <span class="count" id="count_Atmosphere">0</span>
      </button>
    </div>

    <!-- MOVEMENTS GRID -->
    <main class="movements-grid" id="movementsGrid"></main>

  </div>

  <!-- ADD MOVEMENT MODAL POPUP -->
  <div id="movementModal" class="modal-overlay" style="display: none;">
    <div class="modal-box">
      <div class="modal-header">
        <h3 style="margin: 0; font-size: 18px; color: var(--accent-cyan);">+ Add New Movement</h3>
        <button type="button" id="closeModalBtn" class="close-btn">&times;</button>
      </div>
      
      <form id="movementForm">
        <div class="form-group">
          <label for="itemCategory">Category</label>
          <select id="itemCategory" required>
            <option value="Camera Movement">Camera Movement</option>
            <option value="Camera Angles">Camera Angles</option>
            <option value="Camera Shots">Camera Shots</option>
            <option value="Cinematic Lighting">Cinematic Lighting</option>
            <option value="Atmosphere">Atmosphere</option>
          </select>
        </div>

        <div class="form-group">
          <label for="itemTitle">Movement Name</label>
          <input type="text" id="itemTitle" placeholder="e.g. Dolly Zoom, Dutch Angle, Neon Rim Light" required />
        </div>

        <div class="form-group">
          <label for="itemPrompt">Prompt Formula / Description</label>
          <textarea id="itemPrompt" rows="3" placeholder="Enter AI prompt tags and instructions..." required></textarea>
        </div>

        <div class="form-group">
          <label for="itemMedia">Upload Media (Image or Video)</label>
          <input type="file" id="itemMedia" accept="image/*,video/*" required />
        </div>

        <div id="uploadStatus" style="font-size: 13px; color: var(--accent-cyan); margin-bottom: 12px; display: none; text-align: center;">Uploading...</div>

        <button type="submit" id="saveBtn" class="submit-btn">+ Save to Vault</button>
      </form>
    </div>
  </div>

  <div id="toast">
    <i class="fa-solid fa-circle-check"></i>
    <span>Prompt copied to clipboard!</span>
  </div>

  <!-- Base 44 Movements List & Local Logic -->
  <script>
    const defaultMovements = [
      { id: "mov_1", name: "Slow Dolly In", category: "Camera Movement", prompt: "Slow dolly in, camera moves slowly forward toward the subject." },
      { id: "mov_2", name: "Slow Dolly Out", category: "Camera Movement", prompt: "Slow dolly out, camera moves slowly backwards away from the subject." },
      { id: "mov_3", name: "Fast Dolly In", category: "Camera Movement", prompt: "Fast dolly in, camera moves rapidly forward toward the subject, urgent motion." },
      { id: "mov_4", name: "Vertigo Effect (Zolly)", category: "Camera Movement", prompt: "Vertigo effect, dolly zoom, camera moves backward while zooming in, background expands." },
      { id: "mov_5", name: "Extreme Macro Zoom", category: "Camera Movement", prompt: "Extreme macro zoom, zoom transition from subject to micro details of surface." },
      { id: "mov_6", name: "Cosmic Hyper Zoom", category: "Camera Movement", prompt: "Cosmic hyper zoom, fast zoom transition from extreme wide view down to macro level." },
      { id: "mov_7", name: "Over the Shoulder (OTS) Shot", category: "Camera Movement", prompt: "Over the shoulder shot, camera mounted behind subject A framing subject B." },
      { id: "mov_8", name: "Fisheye or Peephole Lens", category: "Camera Movement", prompt: "Fisheye lens, extreme wide-angle distortion, circular frame." },
      { id: "mov_9", name: "Reveal from Behind", category: "Camera Movement", prompt: "Wipe movement, camera slides laterally from behind foreground object to reveal the scene." },
      { id: "mov_10", name: "Through Shot", category: "Camera Movement", prompt: "Fly through, camera moves through an opening into the scene." },
      { id: "mov_11", name: "Reveal from Blur", category: "Camera Movement", prompt: "Rack focus, start completely out of focus, slowly pull focus until sharp." },
      { id: "mov_12", name: "Rack Focus", category: "Camera Movement", prompt: "Rack focus, focus shifts from the foreground object to the background subject." },
      { id: "mov_13", name: "Tilt Up", category: "Camera Movement", prompt: "Tilt up, camera pans vertically up from bottom to top." },
      { id: "mov_14", name: "Tilt Down", category: "Camera Movement", prompt: "Tilt down, camera pans vertically down from top to bottom." },
      { id: "mov_15", name: "Camera Truck Left", category: "Camera Movement", prompt: "Truck left, camera moves sideways on a track to the left." },
      { id: "mov_16", name: "Lateral Truck Right", category: "Camera Movement", prompt: "Truck right, camera moves sideways on a track to the right." },
      { id: "mov_17", name: "Orbit 180 (Spin)", category: "Camera Movement", prompt: "Orbit 180, camera moves in a half-circle around the subject." },
      { id: "mov_18", name: "Fast 360 Orbit (Spin)", category: "Camera Movement", prompt: "Fast 360 orbit, camera spins rapidly 360 degrees around the subject." },
      { id: "mov_19", name: "True Orbit 180", category: "Camera Movement", prompt: "180 orbit, camera orbits 180 degrees around the [subject]." },
      { id: "mov_20", name: "True Orbit 360", category: "Camera Movement", prompt: "Fast 360 orbit, camera orbits 360 degrees around the [subject]." },
      { id: "mov_21", name: "Slow Cinematic Arc", category: "Camera Movement", prompt: "Slow cinematic arc, camera moves in a wide curve to reveal side profile." },
      { id: "mov_22", name: "Pedestal Down", category: "Camera Movement", prompt: "Pedestal down, camera lowers vertically straight down." },
      { id: "mov_23", name: "Pedestal Up", category: "Camera Movement", prompt: "Pedestal up, camera rises vertically straight up from waist to eye level." },
      { id: "mov_24", name: "Crane Up (High Angle Reveal)", category: "Camera Movement", prompt: "Crane up, camera lifts high into the air." },
      { id: "mov_25", name: "Crane Down (Landing)", category: "Camera Movement", prompt: "Crane down, camera descends slowly to the subject." },
      { id: "mov_26", name: "Smooth Optical Zoom In", category: "Camera Movement", prompt: "Smooth optical zoom in, lens magnifies subject, camera stays stationary." },
      { id: "mov_27", name: "Smooth Optical Zoom Out", category: "Camera Movement", prompt: "Smooth optical zoom out, lens widens, background becomes blurry." },
      { id: "mov_28", name: "Snap Zoom (Crash Zoom)", category: "Camera Movement", prompt: "Snap zoom, crash zoom, rapid zoom directly into the eyes." },
      { id: "mov_29", name: "Drone Fly Over", category: "Camera Movement", prompt: "Drone fly over, high altitude flight moving forward over the landscape." },
      { id: "mov_30", name: "Epic Drone Reveal", category: "Camera Movement", prompt: "Epic drone reveal, rising and tilting down to reveal the scene." },
      { id: "mov_31", name: "Large Scale Drone Orbit", category: "Camera Movement", prompt: "Large scale drone orbit, massive sweeping circle around the landscape." },
      { id: "mov_32", name: "Top Down (God's Eye View)", category: "Camera Movement", prompt: "Top down shot, camera pointing straight down, slow twist." },
      { id: "mov_33", name: "FPV Drone Aggressive (Drone Dive)", category: "Camera Movement", prompt: "FPV drone dive, aggressive diving motion down a vertical structure." },
      { id: "mov_34", name: "Handheld Documentary Style", category: "Camera Movement", prompt: "Handheld camera, shaky motion, natural movement, documentary style." },
      { id: "mov_35", name: "Whip Pan", category: "Camera Movement", prompt: "Whip pan, camera whips violently to the side with extreme directional motion blur." },
      { id: "mov_36", name: "Dutch Angle (Roll)", category: "Camera Movement", prompt: "Dutch angle, camera roll, tilted sideways on Z-axis." },
      { id: "mov_37", name: "Leading Shot (Backward Tracking)", category: "Camera Movement", prompt: "Leading shot, camera moves backward matching the subject's speed." },
      { id: "mov_38", name: "Following Shot (Forward Tracking)", category: "Camera Movement", prompt: "Following shot, camera follows behind the subject matching speed." },
      { id: "mov_39", name: "Side Tracking (Parallel)", category: "Camera Movement", prompt: "Side tracking, camera trucks alongside the subject." },
      { id: "mov_40", name: "POV Walk (First Person Walk)", category: "Camera Movement", prompt: "POV walk, first person camera moving forward with bobbing motion." },
      { id: "mov_41", name: "Hyperlapse (Moving Time-Lapse)", category: "Camera Movement", prompt: "Hyperlapse, camera moves forward rapidly, time accelerated, fast motion, light trails." },
      { id: "mov_42", name: "Barrel Roll (Vortex Inception Shot)", category: "Camera Movement", prompt: "Barrel roll, camera spins 360 degrees clockwise while moving forward, disorienting." },
      { id: "mov_43", name: "Bullet Time (Frozen Moment)", category: "Camera Movement", prompt: "Bullet time, frozen moment, ultra slow motion, camera orbit right." },
      { id: "mov_44", name: "Worm's Eye Tracking (Ground Level)", category: "Camera Movement", prompt: "Worm's eye view, low angle tracking, camera moves along the ground looking up." }
    ];

    window.allVaultItems = [...defaultMovements];
    let currentCategory = "All";

    /* IndexedDB for persisting manual video clips in browser */
    let dbLocal;
    const request = indexedDB.open("CinemotionPersistDB", 1);
    request.onupgradeneeded = (e) => {
      dbLocal = e.target.result;
      if (!dbLocal.objectStoreNames.contains("uploadedVideos")) {
        dbLocal.createObjectStore("uploadedVideos", { keyPath: "id" });
      }
    };
    request.onsuccess = (e) => {
      dbLocal = e.target.result;
      renderCards(window.allVaultItems);
    };

    const grid = document.getElementById('movementsGrid');

    function renderCards(list) {
      grid.innerHTML = list.map(item => `
        <div class="movement-card" id="card_${item.id}">
          <div class="card-video-box" onclick="triggerUpload('${item.id}')">
            ${item.mediaURL ? (
              item.mediaType === 'video' 
                ? `<video src="${item.mediaURL}" class="active-video" controls playsinline></video>`
                : `<img src="${item.mediaURL}" class="active-video" alt="${item.name}">`
            ) : `
              <video id="video_${item.id}" autoplay loop muted playsinline></video>
              <div class="upload-overlay" id="overlay_${item.id}">
                <i class="fa-solid fa-cloud-arrow-up"></i>
                <span>Upload Video</span>
              </div>
              <input type="file" class="file-input" id="input_${item.id}" accept="video/*" onchange="processVideoUpload(event, '${item.id}')">
            `}
          </div>
          <div class="card-details">
            <div>
              <div class="card-meta">
                <span class="tag-badge">${item.category || 'Movement'}</span>
              </div>
              <h3>${item.name}</h3>
              <p class="prompt-box">${item.prompt}</p>
            </div>
            <button class="generate-btn" onclick="copyPromptText('${item.prompt.replace(/'/g, "\\'")}')">
              <i class="fa-solid fa-bolt"></i> Generate
            </button>
          </div>
        </div>
      `).join('');

      // Restore saved local IndexedDB videos
      if (dbLocal) {
        const tx = dbLocal.transaction("uploadedVideos", "readonly");
        const store = tx.objectStore("uploadedVideos");
        list.forEach(item => {
          if (!item.mediaURL) {
            const r = store.get(item.id);
            r.onsuccess = () => {
              if (r.result && r.result.blob) {
                setVideoSrc(item.id, r.result.blob);
              }
            };
          }
        });
      }

      updateCounts();
    }

    function updateCounts() {
      const hero = document.getElementById('heroCount');
      if (hero) hero.innerText = window.allVaultItems.length;

      const catCounts = {
        'Camera Movement': 0,
        'Camera Angles': 0,
        'Camera Shots': 0,
        'Cinematic Lighting': 0,
        'Atmosphere': 0
      };

      window.allVaultItems.forEach(item => {
        if (catCounts[item.category] !== undefined) {
          catCounts[item.category]++;
        }
      });

      const countAll = document.getElementById('count_All');
      if (countAll) countAll.innerText = window.allVaultItems.length;

      for (const [cat, count] of Object.entries(catCounts)) {
        const idKey = 'count_' + cat.replace(/\s+/g, '_');
        const el = document.getElementById(idKey);
        if (el) el.innerText = count;
      }
    }

    function triggerUpload(id) {
      const input = document.getElementById(`input_${id}`);
      if (input) input.click();
    }

    function processVideoUpload(e, id) {
      const file = e.target.files[0];
      if (file) {
        setVideoSrc(id, file);
        if (dbLocal) {
          const tx = dbLocal.transaction("uploadedVideos", "readwrite");
          tx.objectStore("uploadedVideos").put({ id: id, blob: file });
        }
      }
    }

    function setVideoSrc(id, blobOrFile) {
      const vid = document.getElementById(`video_${id}`);
      const overlay = document.getElementById(`overlay_${id}`);
      if (vid && overlay) {
        vid.src = URL.createObjectURL(blobOrFile);
        vid.classList.add('active-video');
        overlay.style.opacity = '0';
        overlay.onmouseenter = () => overlay.style.opacity = '1';
        overlay.onmouseleave = () => overlay.style.opacity = '0';
      }
    }

    function copyPromptText(text) {
      navigator.clipboard.writeText(text).then(() => {
        const toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2200);
      });
    }

    function filterCategory(cat, btn) {
      document.querySelectorAll('.cat-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentCategory = cat;
      filterCards();
    }

    function filterCards() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      let filtered = window.allVaultItems;

      if (currentCategory !== "All") {
        filtered = filtered.filter(m => m.category === currentCategory);
      }

      filtered = filtered.filter(m => m.name.toLowerCase().includes(q) || m.prompt.toLowerCase().includes(q));
      renderCards(filtered);
    }
  </script>

  <!-- Firebase SDKs & Full Integration Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCbF3oQKFz0pFVZ5EdOzFbfrqhiWfKsqHk",
      authDomain: "ai-film-making-7d66f.firebaseapp.com",
      projectId: "ai-film-making-7d66f",
      storageBucket: "ai-film-making-7d66f.firebasestorage.app",
      messagingSenderId: "690131375276",
      appId: "1:690131375276:web:baae8d4bb47874e5e4bb09",
      measurementId: "G-MFLLSFB155"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    const addBtn = document.getElementById("addMovementBtn");
    const modal = document.getElementById("movementModal");
    const closeBtn = document.getElementById("closeModalBtn");
    const movementForm = document.getElementById("movementForm");
    const uploadStatus = document.getElementById("uploadStatus");
    const saveBtn = document.getElementById("saveBtn");

    if (addBtn) {
      addBtn.addEventListener("click", () => {
        modal.style.display = "flex";
      });
    }

    if (closeBtn) {
      closeBtn.addEventListener("click", () => {
        modal.style.display = "none";
      });
    }

    window.addEventListener("click", (e) => {
      if (e.target === modal) modal.style.display = "none";
    });

    movementForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const fileInput = document.getElementById("itemMedia");
      const file = fileInput.files[0];
      if (!file) {
        alert("దయచేసి ఒక ఇమేజ్ లేదా వీడియో ఫైల్‌ను సెలెక్ట్ చేయండి.");
        return;
      }

      const category = document.getElementById("itemCategory").value;
      const title = document.getElementById("itemTitle").value;
      const prompt = document.getElementById("itemPrompt").value;
      const mediaType = file.type.startsWith("video") ? "video" : "image";

      try {
        saveBtn.disabled = true;
        uploadStatus.style.display = "block";
        uploadStatus.innerText = "Firebase Storage లో ఫైల్ అప్‌లోడ్ అవుతోంది...";

        const fileRef = ref(storage, `vault_media/${Date.now()}_${file.name}`);
        const snapshot = await uploadBytes(fileRef, file);
        const downloadURL = await getDownloadURL(snapshot.ref);

        uploadStatus.innerText = "Firestore లో సేవ్ అవుతోంది...";

        const movementData = {
          name: title,
          category: category,
          prompt: prompt,
          mediaURL: downloadURL,
          mediaType: mediaType,
          createdAt: new Date().toISOString()
        };

        const docRef = await addDoc(collection(db, "movements"), movementData);
        movementData.id = docRef.id;

        // UI లో కొత్త కార్డును పైభాగంలో చేర్చడం
        window.allVaultItems.unshift(movementData);
        filterCards();

        uploadStatus.style.display = "none";
        movementForm.reset();
        saveBtn.disabled = false;
        modal.style.display = "none";
        alert("కొత్త మూవ్‌మెంట్ విజయవంతంగా సేవ్ అయ్యింది!");

      } catch (error) {
        console.error("Firebase Error:", error);
        alert("Upload Failed: " + error.message);
        uploadStatus.style.display = "none";
        saveBtn.disabled = false;
      }
    });

    // Firestore నుండి మునుపటి డేటాను లోడ్ చేయడం
    async function loadFirebaseMovements() {
      try {
        const q = query(collection(db, "movements"), orderBy("createdAt", "desc"));
        const snapshot = await getDocs(q);
        const firebaseItems = [];
        snapshot.forEach(doc => {
          firebaseItems.push({ id: doc.id, ...doc.data() });
        });
        if (firebaseItems.length > 0) {
          window.allVaultItems = [...firebaseItems, ...defaultMovements];
          filterCards();
        }
      } catch (err) {
        console.error("Error loading movements from Firebase:", err);
      }
    }

    loadFirebaseMovements();
  </script>
</body>
