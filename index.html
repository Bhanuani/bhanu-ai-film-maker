<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CINEMOTION STUDIO - Master Directors Vault</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

  <style>
    :root {
      --bg-dark: #040711;
      --card-bg: #0d121f;
      --border-color: rgba(255, 255, 255, 0.08);
      --accent-cyan: #00d2ff;
      --accent-glow: rgba(0, 210, 255, 0.35);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Regular users cannot see admin editing/deleting options */
    body:not(.is-admin-active) .admin-only {
      display: none !important;
    }

    /* HEADER */
    header {
      background: rgba(4, 7, 17, 0.95);
      border-bottom: 1px solid var(--border-color);
      backdrop-filter: blur(16px);
      position: sticky;
      top: 0;
      z-index: 100;
      width: 100%;
    }

    .header-inner {
      max-width: 98%;
      margin: 0 auto;
      padding: 0.85rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1.5rem;
    }

    .brand-group { display: flex; align-items: center; gap: 1.25rem; }

    .menu-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 0.5rem 0.65rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s;
    }

    .menu-btn:hover { background: rgba(0, 210, 255, 0.1); border-color: var(--accent-cyan); }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.35rem;
      font-weight: 800;
      user-select: none;
    }

    .brand-logo .studio-pill {
      background: rgba(0, 210, 255, 0.12);
      border: 1px solid #00d2ff;
      color: #00d2ff;
      font-size: 0.68rem;
      padding: 0.15rem 0.55rem;
      border-radius: 999px;
      font-weight: 700;
    }

    .search-box {
      flex: 1;
      max-width: 650px;
      position: relative;
    }

    .search-box i {
      position: absolute;
      left: 1.1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .search-box input {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-color);
      padding: 0.65rem 1.25rem 0.65rem 2.6rem;
      border-radius: 999px;
      color: #fff;
      font-size: 0.88rem;
      outline: none;
      transition: all 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .add-btn {
      background: var(--accent-cyan);
      color: #040711;
      border: none;
      padding: 0.6rem 1.25rem;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: opacity 0.2s, transform 0.2s;
    }

    .add-btn:hover { opacity: 0.9; transform: translateY(-1px); }

    .user-pill {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.82rem;
      font-weight: 700;
      user-select: none;
    }

    .user-pill .avatar {
      background: #00d2ff;
      color: #000;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 0.75rem;
      font-weight: 800;
    }

    .logout-btn-header {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #ef4444;
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .logout-btn-header:hover { background: #ef4444; color: #fff; }

    /* SIDEBAR */
    .sidebar-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(6px); z-index: 99998; display: none;
    }
    .sidebar-overlay.active { display: block; }

    .sidebar-drawer {
      position: fixed; top: 0; left: -320px; width: 310px; height: 100vh; background: #090e1a;
      border-right: 1px solid rgba(0, 210, 255, 0.25); z-index: 99999; display: flex; flex-direction: column;
      transition: left 0.35s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 10px 0 40px rgba(0,0,0,0.8);
    }
    .sidebar-drawer.active { left: 0; }

    .sidebar-header {
      padding: 1.25rem 1.5rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color);
    }

    .sidebar-menu { padding: 1.5rem 1rem; display: flex; flex-direction: column; gap: 0.6rem; }

    .sidebar-item {
      display: flex; align-items: center; gap: 1rem; padding: 0.85rem 1.25rem; color: #cbd5e1; border-radius: 10px;
      font-size: 0.95rem; font-weight: 600; transition: all 0.2s; cursor: pointer; background: transparent; border: 1px solid transparent; width: 100%; text-align: left;
    }

    .sidebar-item i { font-size: 1.15rem; color: var(--accent-cyan); width: 24px; }
    .sidebar-item:hover { background: rgba(0, 210, 255, 0.08); border-color: rgba(0, 210, 255, 0.3); color: #fff; }

    .sidebar-badge {
      margin-left: auto; background: var(--accent-cyan); color: #000; font-size: 0.72rem; font-weight: 800; padding: 0.15rem 0.5rem; border-radius: 999px;
    }

    /* VAULT LAYOUT CONTAINER */
    .vault-container { 
      max-width: 98%; 
      margin: 0 auto; 
      padding: 1.5rem 1rem 5rem; 
    }

    /* HERO BANNER */
    .hero-banner-wrapper {
      position: relative; 
      background: #000; 
      border: 1px solid rgba(0, 210, 255, 0.3); 
      border-radius: 20px;
      overflow: hidden; 
      box-shadow: 0 0 50px rgba(0, 150, 255, 0.25); 
      margin-bottom: 2rem; 
      cursor: pointer; 
      transition: border-color 0.4s ease, box-shadow 0.4s ease;
      width: 100%;
      height: 480px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-banner-wrapper:hover {
      border-color: rgba(0, 210, 255, 0.65); 
      box-shadow: 0 0 70px rgba(0, 210, 255, 0.4);
    }

    .hero-ambient-backdrop {
      position: absolute;
      inset: -25px;
      width: calc(100% + 50px);
      height: calc(100% + 50px);
      object-fit: cover;
      filter: blur(45px) brightness(0.65) saturate(1.5);
      opacity: 0.85;
      pointer-events: none;
      z-index: 1;
      transform: scale(1.1);
    }

    .hero-foreground-video {
      position: relative;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      display: block;
      z-index: 2;
      filter: drop-shadow(0 0 35px rgba(0, 0, 0, 0.95));
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* CATEGORIES BAR */
    .categories-bar-wrapper {
      position: relative;
      margin-bottom: 2.2rem;
      width: 100%;
    }

    .categories-bar {
      display: flex; 
      align-items: center; 
      gap: 0.85rem; 
      overflow-x: auto; 
      padding-bottom: 0.95rem; 
      scrollbar-width: thin;
      scrollbar-color: var(--accent-cyan) rgba(255, 255, 255, 0.05);
      -webkit-overflow-scrolling: touch;
      width: 100%;
    }

    .categories-bar::-webkit-scrollbar { height: 6px; }
    .categories-bar::-webkit-scrollbar-thumb { background: linear-gradient(90deg, #00d2ff 0%, #0088cc 100%); border-radius: 999px; }

    .cat-tab {
      background: rgba(10, 16, 28, 0.85); 
      border: 1px solid rgba(255, 255, 255, 0.08); 
      color: var(--text-muted);
      padding: 0.65rem 1.35rem; 
      border-radius: 999px; 
      font-size: 1.05rem; 
      font-weight: 700; 
      letter-spacing: 0.3px;
      display: flex;
      align-items: center; 
      gap: 0.85rem; 
      cursor: pointer; 
      white-space: nowrap; 
      transition: all 0.25s ease; 
      backdrop-filter: blur(10px);
      user-select: none;
    }

    .cat-tab:hover { border-color: rgba(0, 210, 255, 0.4); background: rgba(0, 210, 255, 0.05); color: #fff; }
    .cat-tab.active {
      background: linear-gradient(135deg, rgba(0, 210, 255, 0.2) 0%, rgba(13, 18, 31, 0.95) 100%);
      border-color: var(--accent-cyan); color: #fff; box-shadow: 0 0 20px rgba(0, 210, 255, 0.25);
    }
    .cat-tab span.count { 
      background: rgba(255, 255, 255, 0.08); 
      padding: 0.2rem 0.65rem; 
      border-radius: 999px; 
      font-size: 0.85rem; 
      font-weight: 800; 
    }
    .cat-tab.active span.count { background: var(--accent-cyan); color: #000; }

    .cat-3d-img {
      width: 40px; 
      height: 40px; 
      object-fit: contain; 
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.8));
      animation: iconFloatContinuous 3s ease-in-out infinite alternate; 
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes iconFloatContinuous { 0% { transform: translateY(0px) rotate(0deg); } 100% { transform: translateY(-4px) rotate(3deg); } }

    /* CARD GRID */
    .movements-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 1.5rem; width: 100%; }

    .movement-card {
      background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 14px; overflow: hidden;
      display: flex; flex-direction: column; transition: transform 0.2s ease, border-color 0.2s ease; position: relative;
    }
    .movement-card:hover { transform: translateY(-4px); border-color: rgba(0, 210, 255, 0.4); box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5); }

    .card-video-box {
      width: 100%; aspect-ratio: 16 / 9; background: #000; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; border-bottom: 1px solid var(--border-color); cursor: pointer;
    }
    .card-video-box video, .card-video-box img, .card-video-box iframe { width: 100%; height: 100%; object-fit: cover; display: none; border: none; }
    .card-video-box video.active-media, .card-video-box img.active-media, .card-video-box iframe.active-media { display: block; }

    .upload-overlay {
      position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 0.6rem; background: rgba(8, 12, 22, 0.78); border: 2px dashed rgba(0, 210, 255, 0.3); border-radius: 10px; margin: 8px;
    }
    .card-video-box.has-media .upload-overlay { display: none !important; }

    .link-upload-pill {
      background: rgba(0, 210, 255, 0.1);
      border: 1px solid rgba(0, 210, 255, 0.4);
      color: var(--accent-cyan);
      padding: 0.3rem 0.8rem;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 700;
      cursor: pointer;
    }

    .card-details { padding: 1.25rem; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; gap: 1rem; }
    .card-meta { display: flex; align-items: center; justify-content: space-between; }
    .tag-badge { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; color: var(--accent-cyan); background: rgba(0, 210, 255, 0.08); padding: 0.2rem 0.5rem; border-radius: 6px; border: 1px solid rgba(0, 210, 255, 0.2); }

    .card-meta-actions { display: flex; align-items: center; gap: 7px; }
    .meta-action-btn { width: 30px; height: 30px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.12); background: rgba(255, 255, 255, 0.04); color: #94a3b8; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }

    .prompt-wrapper {
      position: relative;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      min-height: 90px;
      overflow: hidden;
      display: flex;
      align-items: center;
    }

    .prompt-content { width: 100%; padding: 0.85rem; }
    .prompt-box { font-size: 0.86rem; color: #cbd5e1; line-height: 1.5; max-height: 140px; overflow-y: auto; white-space: pre-wrap; word-break: break-word; }

    .copy-btn {
      width: 100%;
      background: linear-gradient(135deg, #00d2ff 0%, #0099cc 100%);
      color: #040711;
      border: none;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    /* AUTHENTICATION GATE & FORGOT PASSWORD MODALS */
    .auth-gate-modal { position: fixed; inset: 0; background: rgba(3, 7, 18, 0.96); backdrop-filter: blur(25px); z-index: 1000000; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
    .auth-card { background: #0c1222; border: 1px solid rgba(0, 210, 255, 0.35); border-radius: 20px; width: 100%; max-width: 440px; padding: 2rem; box-shadow: 0 0 60px rgba(0, 210, 255, 0.2); }
    .auth-tabs { display: flex; border-bottom: 1px solid var(--border-color); margin-bottom: 1.5rem; }
    .auth-tab-btn { flex: 1; padding: 0.75rem; background: none; border: none; color: #94a3b8; font-weight: 700; cursor: pointer; border-bottom: 2px solid transparent; font-size: 0.9rem; }
    .auth-tab-btn.active { color: var(--accent-cyan); border-bottom-color: var(--accent-cyan); }
    
    .form-group { margin-bottom: 16px; display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 13px; color: #94a3b8; font-weight: 600; }
    .form-group input { background: #161e2e; border: 1px solid #334155; color: #f8fafc; padding: 12px 14px; border-radius: 8px; font-size: 14px; outline: none; }
    .submit-btn { width: 100%; padding: 12px; background: var(--accent-cyan); border: none; border-radius: 8px; color: #040711; font-weight: 700; cursor: pointer; font-size: 0.95rem; }
    .forgot-pass-link { font-size: 12px; color: var(--accent-cyan); text-align: right; cursor: pointer; margin-top: -8px; margin-bottom: 14px; display: block; text-decoration: none; }
    .forgot-pass-link:hover { text-decoration: underline; }

    #toast { visibility: hidden; position: fixed; bottom: 2rem; right: 2rem; background: #00d2ff; color: #040711; padding: 0.75rem 1.4rem; border-radius: 999px; font-weight: 700; z-index: 1000000; opacity: 0; transition: opacity 0.3s; }
    #toast.show { visibility: visible; opacity: 1; }

    /* Lightbox */
    #mediaLightbox { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.92); backdrop-filter: blur(16px); z-index: 100000; display: none; align-items: center; justify-content: center; padding: 2rem; }
    .lightbox-box { background: #090e1a; border: 1px solid rgba(0, 210, 255, 0.4); border-radius: 20px; max-width: 960px; width: 100%; overflow: hidden; }
    .lightbox-stage { width: 100%; height: 55vh; background: #000; display: flex; align-items: center; justify-content: center; }
    .lightbox-stage video, .lightbox-stage iframe { width: 100%; height: 100%; border: none; }
    .lightbox-footer { padding: 1.2rem 1.5rem; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--border-color); gap: 1.5rem; }
  </style>
</head>
<body>

  <!-- PORTAL AUTHENTICATION GATE (LOGIN / REGISTER / PHONE OTP) -->
  <div id="authGateModal" class="auth-gate-modal" style="display: none;">
    <div class="auth-card">
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <h2 style="font-family: 'Space Grotesk', sans-serif; font-size: 1.5rem; color: #fff;">CINEMOTION STUDIO</h2>
        <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 4px;">Director Vault Sign-In</p>
      </div>

      <div class="auth-tabs">
        <button type="button" class="auth-tab-btn active" id="tabEmailBtn" onclick="switchAuthMode('email')">Email Login / Sign Up</button>
        <button type="button" class="auth-tab-btn" id="tabPhoneBtn" onclick="switchAuthMode('phone')">Mobile (OTP)</button>
      </div>

      <!-- EMAIL LOGIN & REGISTRATION -->
      <form id="emailAuthForm">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="userEmailInput" placeholder="name@example.com" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="userPassInput" placeholder="••••••••" required />
        </div>
        <a class="forgot-pass-link" onclick="openForgotPasswordModal()">Forgot Password?</a>
        <button type="submit" class="submit-btn" id="emailSubmitBtn">Login / Register</button>
      </form>

      <!-- MOBILE OTP FORM -->
      <form id="phoneAuthForm" style="display: none;">
        <div class="form-group">
          <label>Mobile Number (with Country Code)</label>
          <input type="tel" id="userPhoneInput" placeholder="+91 9876543210" />
        </div>
        <div id="recaptcha-container"></div>
        <div class="form-group" id="otpGroup" style="display: none;">
          <label>Enter 6-Digit OTP</label>
          <input type="text" id="otpCodeInput" placeholder="123456" maxlength="6" />
        </div>
        <button type="button" class="submit-btn" id="sendOtpBtn" onclick="requestPhoneOtp()">Send OTP</button>
        <button type="button" class="submit-btn" id="verifyOtpBtn" style="display: none;" onclick="confirmPhoneOtp()">Verify & Sign In</button>
      </form>
    </div>
  </div>

  <!-- FORGOT PASSWORD MODAL -->
  <div id="forgotPasswordModal" class="auth-gate-modal" style="display: none;">
    <div class="auth-card" style="max-width: 400px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2rem;">
        <h3 style="color: var(--accent-cyan); font-size: 1.15rem;"><i class="fa-solid fa-key"></i> Reset Password</h3>
        <button type="button" onclick="closeForgotPasswordModal()" style="background:none; border:none; color:#94a3b8; font-size:1.5rem; cursor:pointer;">&times;</button>
      </div>
      <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 1rem;">Enter your registered Email. We will send a secure password reset link to update your password.</p>
      <form id="forgotPasswordForm">
        <div class="form-group">
          <label>Your Registered Email</label>
          <input type="email" id="resetEmailInput" placeholder="Enter your email" required />
        </div>
        <button type="submit" class="submit-btn">Send Reset Link</button>
      </form>
    </div>
  </div>

  <header>
    <div class="header-inner">
      <div class="brand-group">
        <div class="brand-logo">
          <span>CINEMOTION</span>
          <span class="studio-pill">STUDIO</span>
        </div>
      </div>

      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Search camera motion, prompt formula, angle..." onkeyup="filterCards()">
      </div>

      <div class="header-actions">
        <!-- Admin-Only Button -->
        <button class="add-btn admin-only" id="addMovementBtn" onclick="openLinkModalDirect()">
          <i class="fa-solid fa-plus"></i> Add Movement
        </button>

        <div class="user-pill">
          <div class="avatar" id="headerUserAvatar">U</div>
          <span id="headerUserDisplay">User</span>
        </div>

        <button type="button" class="logout-btn-header" onclick="handleUserLogout()">
          <i class="fa-solid fa-right-from-bracket"></i> Log Out
        </button>
      </div>
    </div>
  </header>

  <div class="vault-container">
    <section class="hero-banner-wrapper" id="heroBanner">
      <video id="heroVideoBg" class="hero-ambient-backdrop" autoplay muted playsinline loop preload="auto" src="hero-banner-1.mp4"></video>
      <video id="heroVideo" class="hero-foreground-video" autoplay muted playsinline loop preload="auto" poster="bhanu-3d-header_2.png" src="hero-banner-1.mp4"></video>
    </section>

    <div class="categories-bar-wrapper">
      <div class="categories-bar">
        <button class="cat-tab active" onclick="filterCategory('All', this)">
          <span>All</span>
          <span class="count" id="count_All">136</span>
        </button>
        <button class="cat-tab" onclick="filterCategory('Camera Movement', this)">
          <img src="Camera-Movement.png" class="cat-3d-img" alt="Camera Movement">
          <span>Camera Movement</span>
          <span class="count" id="count_Camera_Movement">44</span>
        </button>
        <button class="cat-tab" onclick="filterCategory('Camera Angles', this)">
          <img src="Camera-Angles.png" class="cat-3d-img" alt="Camera Angles">
          <span>Camera Angles</span>
          <span class="count" id="count_Camera_Angles">12</span>
        </button>
        <button class="cat-tab" onclick="filterCategory('Camera Shots', this)">
          <img src="Camera-Shots.png" class="cat-3d-img" alt="Camera Shots">
          <span>Camera Shots</span>
          <span class="count" id="count_Camera_Shots">15</span>
        </button>
        <button class="cat-tab" onclick="filterCategory('Cinematic Lighting', this)">
          <img src="Cinematic -lighting.png" class="cat-3d-img" alt="Cinematic Lighting">
          <span>Cinematic Lighting</span>
          <span class="count" id="count_Cinematic_Lighting">0</span>

      const match = url.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/);
      if (match && match[2].length === 11) videoId = match[2];
      return videoId ? `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1&loop=1&playlist=${videoId}&controls=0` : null;
    }

    function getDriveEmbedUrl(url) {
      if (!url) return null;
      const match = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
      return match && match[1] ? `https://drive.google.com/file/d/${match[1]}/preview` : null;
    }

    const grid = document.getElementById('movementsGrid');

    function renderCards(list) {
      if (!grid) return;
      grid.innerHTML = list.map(item => `
        <div class="movement-card" id="card_${item.id}">
          <div class="card-video-box ${item.mediaURL ? 'has-media' : ''}" id="box_${item.id}" onclick="handleCardMediaClick('${item.id}')">
            <video id="vid_${item.id}" autoplay loop muted playsinline></video>
            <img id="img_${item.id}" alt="${item.name}">
            <iframe id="yt_${item.id}" allow="autoplay; encrypted-media" allowfullscreen></iframe>

            <div class="upload-overlay admin-only" id="overlay_${item.id}">
              <div class="link-upload-pill" onclick="promptMediaLink('${item.id}', event)">
                <i class="fa-solid fa-link"></i> <span>Paste Link</span>
              </div>
            </div>
          </div>

          <div class="card-details">
            <div>
              <div class="card-meta">
                <span class="tag-badge">${item.category || 'Movement'}</span>
                
                <div class="card-meta-actions admin-only">
                  <button type="button" class="meta-action-btn" title="Delete" onclick="deleteCardMedia('${item.id}', event)">
                    <i class="fa-solid fa-trash"></i>
                  </button>
                </div>
              </div>

              <h3>${item.name}</h3>
              
              <div class="prompt-wrapper">
                <div class="prompt-content">
                  <p class="prompt-box">${item.prompt}</p>
                </div>
              </div>
            </div>
            
            <button class="copy-btn" onclick="copyPromptText('${item.prompt.replace(/'/g, "\\'")}')">
              <i class="fa-solid fa-copy"></i> Copy Prompt
            </button>
          </div>
        </div>
      `).join('');

      list.forEach(item => {
        if (item.mediaURL) applyMediaUrlToCard(item.id, item.mediaURL, item.mediaType);
      });
    }

    window.cardActiveBlobs = {};

    function applyMediaUrlToCard(id, mediaURL, type) {
      window.cardActiveBlobs[id] = { url: mediaURL, type: type || 'video' };
      const box = document.getElementById(`box_${id}`);
      const vid = document.getElementById(`vid_${id}`);
      const img = document.getElementById(`img_${id}`);
      const yt = document.getElementById(`yt_${id}`);

      if (box) box.classList.add('has-media');

      const isYoutube = type === 'youtube' || mediaURL.includes('youtube.com') || mediaURL.includes('youtu.be');
      const isDrive = type === 'drive' || mediaURL.includes('drive.google.com');

      if (isYoutube) {
        if (img) img.classList.remove('active-media');
        if (vid) vid.classList.remove('active-media');
        if (yt) { yt.src = getYoutubeEmbedUrl(mediaURL); yt.classList.add('active-media'); }
      } else if (isDrive) {
        if (img) img.classList.remove('active-media');
        if (vid) vid.classList.remove('active-media');
        if (yt) { yt.src = getDriveEmbedUrl(mediaURL); yt.classList.add('active-media'); }
      } else if (type === 'video') {
        if (img) img.classList.remove('active-media');
        if (yt) yt.classList.remove('active-media');
        if (vid) { vid.src = mediaURL; vid.loop = true; vid.muted = true; vid.classList.add('active-media'); vid.play().catch(()=>{}); }
      }
    }

    function copyPromptText(text) {
      navigator.clipboard.writeText(text).then(() => {
        showToast("Prompt copied to clipboard!");
      });
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function handleCardMediaClick(id) {
      const media = window.cardActiveBlobs[id];
      const item = window.allVaultItems.find(m => m.id === id);
      if (!media || !media.url) return;

      const lightbox = document.getElementById("mediaLightbox");
      const stage = document.getElementById("lightboxStage");
      document.getElementById("lightboxPrompt").innerText = item ? item.prompt : '';
      stage.innerHTML = '';

      if (media.url.includes('drive.google.com')) {
        stage.innerHTML = `<iframe src="${getDriveEmbedUrl(media.url)}" allow="autoplay" allowfullscreen></iframe>`;
      } else if (media.url.includes('youtube.com') || media.url.includes('youtu.be')) {
        stage.innerHTML = `<iframe src="${getYoutubeEmbedUrl(media.url)}" allow="autoplay" allowfullscreen></iframe>`;
      } else {
        stage.innerHTML = `<video src="${media.url}" controls autoplay loop></video>`;
      }
      lightbox.style.display = 'flex';
    }

    function filterCategory(cat, btn) {
      document.querySelectorAll('.cat-tab').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      currentCategory = cat;
      filterCards();
    }

    function filterCards() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      let filtered = window.allVaultItems;
      if (currentCategory !== "All") filtered = filtered.filter(m => m.category === currentCategory);
      filtered = filtered.filter(m => m.name.toLowerCase().includes(q) || m.prompt.toLowerCase().includes(q));
      renderCards(filtered);
    }

    window.openForgotPasswordModal = function() {
      document.getElementById("forgotPasswordModal").style.display = "flex";
    };

    window.closeForgotPasswordModal = function() {
      document.getElementById("forgotPasswordModal").style.display = "none";
    };

    renderCards(window.allVaultItems);
  </script>

  <!-- FIREBASE AUTH, FORGOT PASS, AND LOGINS INTEGRATION -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { 
      getAuth, 
      onAuthStateChanged, 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword, 
      sendPasswordResetEmail,
      signInWithPhoneNumber, 
      RecaptchaVerifier, 
      signOut 
    } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCbF3oQKFz0pFVZ5EdOzFbfrqhiWfKsqHk",
      authDomain: "ai-film-making-7d66f.firebaseapp.com",
      projectId: "ai-film-making-7d66f",
      storageBucket: "ai-film-making-7d66f.firebasestorage.app",
      messagingSenderId: "690131375276",
      appId: "1:690131375276:web:baae8d4bb47874e5e4bb09",
      measurementId: "G-MFLLSFB155"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const NOTIFY_RECEIVER_EMAIL = "prasadpakala10@gmail.com";

    // Session Persistence: Listen to state change
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        document.getElementById("authGateModal").style.display = "none";
        document.getElementById("headerUserDisplay").innerText = user.email || user.phoneNumber || "User";
        document.getElementById("headerUserAvatar").innerText = (user.email || user.phoneNumber || "U")[0].toUpperCase();

        // Check if Admin securely
        if (user.email === "bhanu.pakala03@gmail.com") {
          document.body.classList.add("is-admin-active");
        } else {
          document.body.classList.remove("is-admin-active");
        }
      } else {
        document.body.classList.remove("is-admin-active");
        document.getElementById("authGateModal").style.display = "flex";
      }
    });

    // Notify prasadpakala10@gmail.com about login details
    async function notifyAdminOnLogin(identifier, method) {
      try {
        await addDoc(collection(db, "user_logins"), {
          identifier: identifier,
          method: method,
          timestamp: new Date().toISOString()
        });

        if (window.emailjs) {
          emailjs.send("default_service", "template_login_alert", {
            to_email: NOTIFY_RECEIVER_EMAIL,
            user_info: identifier,
            login_time: new Date().toLocaleString(),
            auth_type: method
          }).catch(e => console.log("Email Notification:", e));
        }
      } catch (err) {
        console.error("Login tracking error:", err);
      }
    }

    // Switch between Email and Phone tabs
    window.switchAuthMode = function(mode) {
      if (mode === 'email') {
        document.getElementById("tabEmailBtn").classList.add("active");
        document.getElementById("tabPhoneBtn").classList.remove("active");
        document.getElementById("emailAuthForm").style.display = "block";
        document.getElementById("phoneAuthForm").style.display = "none";
      } else {
        document.getElementById("tabPhoneBtn").classList.add("active");
        document.getElementById("tabEmailBtn").classList.remove("active");
        document.getElementById("phoneAuthForm").style.display = "block";
        document.getElementById("emailAuthForm").style.display = "none";
        initRecaptcha();
      }
    };

    // EMAIL SIGN IN / REGISTER
    document.getElementById("emailAuthForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("userEmailInput").value.trim();
      const pass = document.getElementById("userPassInput").value;

      try {
        await signInWithEmailAndPassword(auth, email, pass);
        notifyAdminOnLogin(email, "Email Login");
      } catch (signInErr) {
        if (signInErr.code === 'auth/user-not-found' || signInErr.code === 'auth/invalid-credential') {
          try {
            await createUserWithEmailAndPassword(auth, email, pass);
            notifyAdminOnLogin(email, "New Registration");
          } catch (signUpErr) {
            alert("Registration Error: " + signUpErr.message);
          }
        } else {
          alert("Login Error: " + signInErr.message);
        }
      }
    });

    // FORGOT PASSWORD -> SENDS RESET LINK TO USER EMAIL
    document.getElementById("forgotPasswordForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const resetEmail = document.getElementById("resetEmailInput").value.trim();

      try {
        await sendPasswordResetEmail(auth, resetEmail);
        alert("A password reset email has been sent to " + resetEmail + ". Check your inbox to verify and update your password.");
        closeForgotPasswordModal();
      } catch (err) {
        alert("Error sending reset email: " + err.message);
      }
    });

    // PHONE OTP AUTHENTICATION
    function initRecaptcha() {
      if (!window.recaptchaVerifier) {
        window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', { 'size': 'invisible' });
      }
    }

    window.requestPhoneOtp = async function() {
      const phoneNumber = document.getElementById("userPhoneInput").value.trim();
      if (!phoneNumber) return alert("Please enter mobile number with country code (+91)");

      try {
        initRecaptcha();
        const confirmationResult = await signInWithPhoneNumber(auth, phoneNumber, window.recaptchaVerifier);
        window.confirmationResult = confirmationResult;
        document.getElementById("otpGroup").style.display = "block";
        document.getElementById("verifyOtpBtn").style.display = "block";
        document.getElementById("sendOtpBtn").style.display = "none";
        alert("OTP sent successfully to " + phoneNumber);
      } catch (err) {
        alert("OTP Error: " + err.message);
      }
    };

    window.confirmPhoneOtp = async function() {
      const code = document.getElementById("otpCodeInput").value.trim();
      if (!code || !window.confirmationResult) return alert("Please enter the 6-digit OTP");

      try {
        const result = await window.confirmationResult.confirm(code);
        notifyAdminOnLogin(result.user.phoneNumber, "Phone OTP");
      } catch (err) {
        alert("Invalid OTP code!");
      }
    };

    // LOGOUT
    window.handleUserLogout = async function() {
      if (confirm("Are you sure you want to log out?")) {
        await signOut(auth);
      }
    };

    // Load custom cloud synced movements from Firestore
    async function loadFirebaseMovements() {
      try {
        const q = query(collection(db, "movements"), orderBy("createdAt", "desc"));
        const snapshot = await getDocs(q);
        const newCustomMovements = [];

        snapshot.forEach(doc => {
          const data = doc.data();
          if (data.name) {
            newCustomMovements.push({ id: doc.id, ...data });
          } else if (data.linkedCardId && data.mediaURL) {
            const target = window.allVaultItems.find(m => m.id === data.linkedCardId);
            if (target) {
              target.mediaURL = data.mediaURL;
              target.mediaType = data.mediaType;
              applyMediaUrlToCard(target.id, data.mediaURL, data.mediaType);
            }
          }
        });

        if (newCustomMovements.length > 0) {
          window.allVaultItems = [...newCustomMovements, ...window.allVaultItems];
          renderCards(window.allVaultItems);
        }
      } catch (err) {
        console.error("Firebase Load Error:", err);
      }
    }

    loadFirebaseMovements();
  </script>
