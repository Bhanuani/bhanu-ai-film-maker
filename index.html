<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>42 Camera Movements for AI Video Prompts</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-color: #0b0d14;
      --card-bg: #131722;
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      line-height: 1.5;
    }

    /* Container */
    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem;
    }

    /* Page Header */
    .header-section {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .header-section h1 {
      font-size: clamp(1.8rem, 4vw, 2.75rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
    }

    .header-section p {
      color: var(--text-sub);
      font-size: 1rem;
      max-width: 600px;
      margin: 0 auto;
    }

    /* Filter Buttons */
    .filter-wrapper {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 2rem;
    }

    .filter-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-sub);
      padding: 0.5rem 1.25rem;
      border-radius: 9999px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-btn.active, .filter-btn:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    /* Movements Grid */
    .movements-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(99, 102, 241, 0.4);
    }

    .video-area {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .video-area video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .video-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      color: #4b5563;
      font-size: 0.8rem;
    }

    .video-placeholder i {
      font-size: 2rem;
    }

    .card-body {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
      gap: 1rem;
    }

    .card-info h3 {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: #fff;
    }

    .card-info p {
      font-size: 0.85rem;
      color: var(--text-sub);
      line-height: 1.4;
    }

    /* Generate / Action Button */
    .action-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.65rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: background 0.2s;
      width: 100%;
    }

    .action-btn:hover {
      background: var(--accent-hover);
    }

    /* Toast Notification */
    #toast {
      visibility: hidden;
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: #10b981;
      color: #fff;
      padding: 0.75rem 1.25rem;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 0.88rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      transform: translateY(15px);
    }

    #toast.show {
      visibility: visible;
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="container">
    <header class="header-section">
      <h1>42 Camera Movements for AI Video Prompts</h1>
      <p>The ultimate reference list of cinematic camera motions for your AI video generations.</p>
    </header>

    <!-- Filter Buttons (Same as AIShotStudio) -->
    <div class="filter-wrapper">
      <button class="filter-btn active" onclick="applyFilter('all', this)">All</button>
      <button class="filter-btn" onclick="applyFilter('Dolly/Track', this)">Dolly/Track</button>
      <button class="filter-btn" onclick="applyFilter('Zoom/Lens', this)">Zoom/Lens</button>
      <button class="filter-btn" onclick="applyFilter('Drone/Crane', this)">Drone/Crane</button>
      <button class="filter-btn" onclick="applyFilter('Pan/Tilt', this)">Pan/Tilt</button>
    </div>

    <!-- Cards Grid -->
    <main class="movements-grid" id="itemsGrid"></main>
  </div>

  <div id="toast">
    <i class="fa-solid fa-check"></i>
    <span>Prompt copied to clipboard!</span>
  </div>

  <script>
    const items = [
      { name: "Slow Dolly In", type: "Dolly/Track", prompt: "Slow dolly in, camera moves slowly forward toward the subject." },
      { name: "Slow Dolly Out", type: "Dolly/Track", prompt: "Slow dolly out, camera moves slowly backwards away from the subject." },
      { name: "Fast Dolly In", type: "Dolly/Track", prompt: "Fast dolly in, camera moves rapidly forward toward the subject, urgent motion." },
      { name: "Vertigo Effect (Zolly)", type: "Zoom/Lens", prompt: "Vertigo effect, dolly zoom, camera moves backward while zooming in, background expands." },
      { name: "Extreme Macro Zoom", type: "Zoom/Lens", prompt: "Extreme macro zoom, zoom transition from subject to micro details of surface." },
      { name: "Cosmic Hyper Zoom", type: "Zoom/Lens", prompt: "Cosmic hyper zoom, fast zoom transition from extreme wide view down to macro level." },
      { name: "Over the Shoulder (OTS) Shot", type: "Dolly/Track", prompt: "Over the shoulder shot, camera mounted behind subject A framing subject B." },
      { name: "Fisheye or Peephole Lens", type: "Zoom/Lens", prompt: "Fisheye lens, extreme wide-angle distortion, circular frame." },
      { name: "Reveal from Behind", type: "Pan/Tilt", prompt: "Wipe movement, camera slides laterally from behind foreground object to reveal the scene." },
      { name: "Through Shot", type: "Drone/Crane", prompt: "Fly through, camera moves through an opening into the scene." },
      { name: "Reveal from Blur", type: "Zoom/Lens", prompt: "Rack focus, start completely out of focus, slowly pull focus until sharp." },
      { name: "Rack Focus", type: "Zoom/Lens", prompt: "Rack focus, focus shifts from the foreground object to the background subject." },
      { name: "Tilt Up", type: "Pan/Tilt", prompt: "Tilt up, camera pans vertically up from bottom to top." },
      { name: "Tilt Down", type: "Pan/Tilt", prompt: "Tilt down, camera pans vertically down from top to bottom." },
      { name: "Camera Truck Left", type: "Dolly/Track", prompt: "Truck left, camera moves sideways on a track to the left." },
      { name: "Lateral Truck Right", type: "Dolly/Track", prompt: "Truck right, camera moves sideways on a track to the right." },
      { name: "Orbit 180 (Spin)", type: "Dolly/Track", prompt: "Orbit 180, camera moves in a half-circle around the subject." },
      { name: "Fast 360 Orbit (Spin)", type: "Dolly/Track", prompt: "Fast 360 orbit, camera spins rapidly 360 degrees around the subject." },
      { name: "True Orbit 180", type: "Dolly/Track", prompt: "180 orbit, camera orbits 180 degrees around the [subject]." },
      { name: "True Orbit 360", type: "Dolly/Track", prompt: "Fast 360 orbit, camera orbits 360 degrees around the [subject]." },
      { name: "Slow Cinematic Arc", type: "Dolly/Track", prompt: "Slow cinematic arc, camera moves in a wide curve to reveal side profile." },
      { name: "Pedestal Down", type: "Drone/Crane", prompt: "Pedestal down, camera lowers vertically straight down." },
      { name: "Pedestal Up", type: "Drone/Crane", prompt: "Pedestal up, camera rises vertically straight up from waist to eye level." },
      { name: "Crane Up (High Angle Reveal)", type: "Drone/Crane", prompt: "Crane up, camera lifts high into the air." },
      { name: "Crane Down (Landing)", type: "Drone/Crane", prompt: "Crane down, camera descends slowly to the subject." },
      { name: "Smooth Optical Zoom In", type: "Zoom/Lens", prompt: "Smooth optical zoom in, lens magnifies subject, camera stays stationary." },
      { name: "Smooth Optical Zoom Out", type: "Zoom/Lens", prompt: "Smooth optical zoom out, lens widens, background becomes blurry." },
      { name: "Snap Zoom (Crash Zoom)", type: "Zoom/Lens", prompt: "Snap zoom, crash zoom, rapid zoom directly into the eyes." },
      { name: "Drone Fly Over", type: "Drone/Crane", prompt: "Drone fly over, high altitude flight moving forward over the landscape." },
      { name: "Epic Drone Reveal", type: "Drone/Crane", prompt: "Epic drone reveal, rising and tilting down to reveal the scene." },
      { name: "Large Scale Drone Orbit", type: "Drone/Crane", prompt: "Large scale drone orbit, massive sweeping circle around the landscape." },
      { name: "Top Down (God's Eye View)", type: "Drone/Crane", prompt: "Top down shot, camera pointing straight down, slow twist." },
      { name: "FPV Drone Aggressive (Drone Dive)", type: "Drone/Crane", prompt: "FPV drone dive, aggressive diving motion down a vertical structure." },
      { name: "Handheld Documentary Style", type: "Pan/Tilt", prompt: "Handheld camera, shaky motion, natural movement, documentary style." },
      { name: "Whip Pan", type: "Pan/Tilt", prompt: "Whip pan, camera whips violently to the side with extreme directional motion blur." },
      { name: "Dutch Angle (Roll)", type: "Pan/Tilt", prompt: "Dutch angle, camera roll, tilted sideways on Z-axis." },
      { name: "Leading Shot (Backward Tracking)", type: "Dolly/Track", prompt: "Leading shot, camera moves backward matching the subject's speed." },
      { name: "Following Shot (Forward Tracking)", type: "Dolly/Track", prompt: "Following shot, camera follows behind the subject matching speed." },
      { name: "Side Tracking (Parallel)", type: "Dolly/Track", prompt: "Side tracking, camera trucks alongside the subject." },
      { name: "POV Walk (First Person Walk)", type: "Dolly/Track", prompt: "POV walk, first person camera moving forward with bobbing motion." },
      { name: "Hyperlapse (Moving Time-Lapse)", type: "Drone/Crane", prompt: "Hyperlapse, camera moves forward rapidly, time accelerated, fast motion, light trails." },
      { name: "Barrel Roll (Vortex Inception Shot)", type: "Pan/Tilt", prompt: "Barrel roll, camera spins 360 degrees clockwise while moving forward, disorienting." },
      { name: "Bullet Time (Frozen Moment)", type: "Dolly/Track", prompt: "Bullet time, frozen moment, ultra slow motion, camera orbit right." },
      { name: "Worm's Eye Tracking (Ground Level)", type: "Dolly/Track", prompt: "Worm's eye view, low angle tracking, camera moves along the ground looking up." }
    ];

    const container = document.getElementById('itemsGrid');

    function renderGrid(list) {
      container.innerHTML = list.map(item => `
        <div class="card">
          <div class="video-area">
            <div class="video-placeholder">
              <i class="fa-solid fa-play"></i>
              <span>Preview</span>
            </div>
          </div>
          <div class="card-body">
            <div class="card-info">
              <h3>${item.name}</h3>
              <p>${item.prompt}</p>
            </div>
            <button class="action-btn" onclick="copyPromptText('${item.prompt.replace(/'/g, "\\'")}')">
              <i class="fa-solid fa-bolt"></i> Generate
            </button>
          </div>
        </div>
      `).join('');
    }

    function applyFilter(category, btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      if (category === 'all') {
        renderGrid(items);
      } else {
        const filtered = items.filter(i => i.type === category);
        renderGrid(filtered);
      }
    }

    function copyPromptText(text) {
      navigator.clipboard.writeText(text).then(() => {
        const toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
      });
    }

    renderGrid(items);
  </script>
</body>
</html>
